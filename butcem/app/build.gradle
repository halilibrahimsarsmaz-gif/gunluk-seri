plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halil.butcem'
    compileSdk 34

    defaultConfig {
        applicationId "com.halil.butcem"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'none.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'gunlukseri'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
