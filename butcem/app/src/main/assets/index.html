<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Bütçem – Gelir Gider Takibi</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#14201d; --muted:#6b7a76; --line:#e3e8e6;
  --brand:#0f766e; --brand2:#14b8a6; --inc:#15803d; --exp:#dc2626; --warn:#d97706; --tr:#2563eb;
  --chip:#eef3f1; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1413;--card:#16201e;--text:#e8efed;--muted:#93a39f;--line:#24312e;--brand:#2dd4bf;--brand2:#14b8a6;
  --inc:#4ade80;--exp:#f87171;--warn:#fbbf24;--tr:#60a5fa;--chip:#1e2a28;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:700}
.iconbtn{border:0;background:var(--chip);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.monthnav{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 16px 8px}
.monthnav b{min-width:130px;text-align:center;font-size:15px}
.wrap{padding:0 14px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:2px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.tile small{display:block;opacity:.85;font-size:11.5px}
.tile b{font-size:14.5px;white-space:nowrap}
h3{font-size:14px;margin:4px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center}
h3 a{color:var(--brand);text-transform:none;letter-spacing:0;font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.inc{color:var(--inc)} .exp{color:var(--exp)} .trc{color:var(--tr)} .mut{color:var(--muted)}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--brand2)}
.bar i.w{background:var(--warn)} .bar i.o{background:var(--exp)}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:12px 4px 2px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .e{font-size:38px;margin-bottom:6px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:66px}
nav.bottom button{border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 0}
nav.bottom button span{font-size:21px;line-height:1}
nav.bottom button.on{color:var(--brand);font-weight:700}
nav.bottom .fab{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;margin:-26px auto 0;box-shadow:0 6px 18px rgba(15,118,110,.45);justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--chip);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--brand)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.btn{border:0;background:var(--brand);color:#fff;font:inherit;font-weight:700;padding:13px 16px;border-radius:14px;cursor:pointer;width:100%}
.btn.sec{background:var(--chip);color:var(--text)}
.btn.del{background:transparent;color:var(--exp);border:1px solid var(--exp)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;margin-top:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.e{color:var(--exp)} .seg button.on.i{color:var(--inc)} .seg button.on.t{color:var(--tr)}
.amtin{font-size:30px;font-weight:800;text-align:center;padding:14px;margin-top:10px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:220px;overflow:auto}
.cat{border:2px solid transparent;background:var(--chip);border-radius:12px;padding:7px 2px;text-align:center;cursor:pointer;font-size:11.5px;color:var(--text)}
.cat span{display:block;font-size:22px}
.cat.on{border-color:var(--brand);background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:none;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet h2{margin:0 0 6px;font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:.94}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--chip);border-radius:12px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:16px}
.legend .row{cursor:default;padding:7px 2px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;font-weight:600}
.tip{font-size:13px;color:var(--muted)}
.menu .row .ico{background:var(--chip)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;border:0;cursor:pointer}
.switch.on{background:var(--brand2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on::after{left:21px}
svg text{fill:var(--muted);font-size:10px}
.search{margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <header class="top"><button class="iconbtn" id="backbtn" style="display:none" data-act="back">‹</button><h1 id="title">Bütçem</h1><span id="sync" class="pill" style="display:none"></span></header>
  <div id="main"></div>
</div>
<nav class="bottom"><div class="in">
  <button data-tab="home" class="on"><span>🏠</span>Özet</button>
  <button data-tab="tx"><span>📋</span>İşlemler</button>
  <button class="fab" data-act="add">+</button>
  <button data-tab="budget"><span>🎯</span>Bütçe</button>
  <button data-tab="reports"><span>📊</span>Raporlar</button>
</div></nav>
<div id="sheetbg"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="filein" accept=".json,application/json" style="display:none">

<script>
(function(){
"use strict";
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2,minimumFractionDigits:0});
const nf2 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
const fmt = n => nf.format(Math.round((n||0)*100)/100);
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ds(new Date());
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const mk = s => s.slice(0,7);
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const mLabel = k => { const [y,m]=k.split("-").map(Number); return MONTHS[m-1]+" "+y; };
const mShift = (k,n) => { const [y,m]=k.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const daysIn = k => { const [y,m]=k.split("-").map(Number); return new Date(y,m,0).getDate(); };
const dLabel = s => { const d=pd(s); const t=today(); const y=ds(new Date(Date.now()-864e5));
  if(s===t) return "Bugün"; if(s===y) return "Dün"; return d.getDate()+" "+MONTHS[d.getMonth()]+" "+DAYS[d.getDay()]; };
const parseAmt = v => { v=String(v||"").trim().replace(/\s|₺/g,""); if(v.includes(",")) v=v.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,""); const n=parseFloat(v); return isFinite(n)?Math.abs(n):NaN; };
const COLORS=["#ef4444","#f97316","#f59e0b","#84cc16","#10b981","#14b8a6","#06b6d4","#3b82f6","#6366f1","#8b5cf6","#d946ef","#ec4899","#64748b","#a16207","#0ea5e9","#22c55e"];
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- veri ---------- */
function defaults(){
  const e=[["Market","🛒"],["Yemek & Kafe","🍽️"],["Ulaşım","🚌"],["Yakıt","⛽"],["Faturalar","💡"],["Kira & Konut","🏠"],["Sağlık","💊"],["Giyim","👕"],["Eğlence","🎬"],["Eğitim","📚"],["Abonelikler","📺"],["Telefon & İnternet","📱"],["Ev & Bakım","🧰"],["Hediye","🎁"],["Bağış & Sadaka","🤲"],["Diğer","📦"]];
  const i=[["Maaş","💼"],["Ek Gelir","💰"],["Kira Geliri","🏘️"],["Yatırım","📈"],["Hediye","🎁"],["Diğer Gelir","➕"]];
  return {v:1,updatedAt:0,
    accounts:[{id:"a_cash",name:"Nakit",icon:"💵",opening:0},{id:"a_bank",name:"Banka",icon:"🏦",opening:0},{id:"a_card",name:"Kredi Kartı",icon:"💳",opening:0}],
    categories:[...e.map((c,k)=>({id:"ce"+k,name:c[0],icon:c[1],color:COLORS[k%COLORS.length],kind:"expense"})),
                ...i.map((c,k)=>({id:"ci"+k,name:c[0],icon:c[1],color:COLORS[(k*3+4)%COLORS.length],kind:"income"}))],
    tx:[],budgets:{},recurring:[],goals:[]};
}
const LS="butcem-v1";
let S;
function lsGet(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
S = lsGet() || defaults();
["accounts","categories","tx","recurring","goals"].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
if(!S.budgets) S.budgets={};
function save(){ S.updatedAt=Date.now(); lsSet(); cloudPush(); }

const cat = id => S.categories.find(c=>c.id===id) || {name:"Silinmiş",icon:"❔",color:"#94a3b8"};
const acc = id => S.accounts.find(a=>a.id===id) || {name:"Silinmiş hesap",icon:"❔",opening:0};
function balance(aid){
  let b=+acc(aid).opening||0;
  for(const t of S.tx){
    if(t.type==="income"&&t.accId===aid) b+=t.amount;
    else if(t.type==="expense"&&t.accId===aid) b-=t.amount;
    else if(t.type==="transfer"){ if(t.accId===aid) b-=t.amount; if(t.toAccId===aid) b+=t.amount; }
  }
  return b;
}
const monthTx = k => S.tx.filter(t=>mk(t.date)===k);
function sums(k){ let inc=0,exp=0; for(const t of monthTx(k)){ if(t.type==="income")inc+=t.amount; else if(t.type==="expense")exp+=t.amount; } return {inc,exp,net:inc-exp}; }
function byCat(k){ const m={}; for(const t of monthTx(k)) if(t.type==="expense") m[t.catId]=(m[t.catId]||0)+t.amount; return m; }
const sortTx = a => a.slice().sort((x,y)=> x.date<y.date?1:x.date>y.date?-1:(y.ts||0)-(x.ts||0));

/* ---------- tekrarlayanlar ---------- */
function advance(r){
  const d=pd(r.next);
  if(r.freq==="weekly") d.setDate(d.getDate()+7);
  else if(r.freq==="yearly") d.setFullYear(d.getFullYear()+1);
  else { const day=r.day||d.getDate(); const n=new Date(d.getFullYear(),d.getMonth()+1,1); n.setDate(Math.min(day,new Date(n.getFullYear(),n.getMonth()+1,0).getDate())); r.next=ds(n); return; }
  r.next=ds(d);
}
function runRecurring(){
  const t=today(); let n=0;
  for(const r of S.recurring){
    if(!r.active) continue; let guard=0;
    while(r.next<=t && guard++<120){
      S.tx.push({id:uid(),ts:Date.now()+n,type:r.type,amount:r.amount,catId:r.catId,accId:r.accId,date:r.next,note:r.name,recId:r.id}); n++;
      advance(r);
    }
  }
  if(n){ save(); setTimeout(()=>toast(n+" tekrarlayan işlem otomatik eklendi"),400); }
}

/* ---------- durum ---------- */
let tab="home", sub=null, month=mk(today()), txFilter={type:"all",q:"",cat:""};
const TITLES={home:"Bütçem",tx:"İşlemler",budget:"Bütçe",reports:"Raporlar",more:"Daha Fazla",accounts:"Hesaplar",recurring:"Tekrarlayan İşlemler",goals:"Birikim Hedefleri",categories:"Kategoriler",backup:"Yedekleme"};

function monthNav(){ return `<div class="monthnav"><button class="iconbtn" data-act="mprev">‹</button><b>${mLabel(month)}</b><button class="iconbtn" data-act="mnext">›</button></div>`; }
function txRow(t){
  let ic,col,title,subt,sign,cls;
  if(t.type==="transfer"){ ic="🔁"; col="#3b82f6"; title="Transfer"; subt=acc(t.accId).name+" → "+acc(t.toAccId).name; sign=""; cls="trc"; }
  else { const c=cat(t.catId); ic=c.icon; col=c.color; title=c.name; subt=acc(t.accId).name; sign=t.type==="income"?"+":"−"; cls=t.type==="income"?"inc":"exp"; }
  if(t.note) subt=esc(t.note)+" · "+esc(subt); else subt=esc(subt);
  return `<div class="row" data-act="edittx" data-id="${t.id}"><div class="ico" style="background:${col}22">${ic}</div><div class="grow"><div class="t1">${esc(title)}${t.recId?'<span class="pill">🔄</span>':""}</div><div class="t2">${subt}</div></div><div class="amt ${cls}">${sign}${fmt(t.amount)}</div></div>`;
}
const emptyBox=(e,m)=>`<div class="empty"><div class="e">${e}</div>${m}</div>`;

/* ---------- görünümler ---------- */
function vHome(){
  const s=sums(month); const total=S.accounts.reduce((a,x)=>a+balance(x.id),0);
  const bc=byCat(month); const top=Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,5); const mx=top.length?top[0][1]:1;
  const bTotal=Object.values(S.budgets).reduce((a,b)=>a+(+b||0),0);
  const bSpent=Object.keys(S.budgets).reduce((a,id)=>a+(bc[id]||0),0);
  const up=S.recurring.filter(r=>r.active).filter(r=>(pd(r.next)-pd(today()))/864e5<=31).sort((a,b)=>a.next<b.next?-1:1).slice(0,4);
  const last=sortTx(S.tx).slice(0,6);
  let h=monthNav()+`<div class="wrap">
  <div class="card hero"><div class="lbl">Toplam varlık (tüm hesaplar)</div><div class="big">${fmt(total)}</div>
   <div class="tiles"><div class="tile"><small>Gelir</small><b>${fmt(s.inc)}</b></div><div class="tile"><small>Gider</small><b>${fmt(s.exp)}</b></div><div class="tile"><small>Kalan</small><b>${fmt(s.net)}</b></div></div></div>`;
  if(bTotal>0){ const p=bSpent/bTotal*100;
    h+=`<div class="card"><h3>Aylık bütçe <a data-tab="budget">Detay</a></h3><div style="display:flex;justify-content:space-between"><b>${fmt(bSpent)}</b><span class="mut">/ ${fmt(bTotal)}</span></div><div class="bar"><i class="${p>=100?"o":p>=80?"w":""}" style="width:${Math.min(100,p)}%"></i></div><div class="t2" style="margin-top:6px">${p>=100?"⚠️ Bütçeyi aştın: "+fmt(bSpent-bTotal):"Kalan: "+fmt(bTotal-bSpent)}</div></div>`; }
  h+=`<div class="card"><h3>En çok harcanan <a data-tab="reports">Rapor</a></h3>`;
  h+= top.length? top.map(([id,v])=>{const c=cat(id);return `<div class="row" style="cursor:default"><div class="ico" style="background:${c.color}22">${c.icon}</div><div class="grow"><div style="display:flex;justify-content:space-between"><span class="t1">${esc(c.name)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${c.color}"></i></div></div></div>`}).join("") : emptyBox("🌱","Bu ay henüz harcama yok.<br>Aşağıdaki <b>+</b> ile ilk kaydını ekle.");
  h+=`</div>`;
  if(up.length){ h+=`<div class="card"><h3>Yaklaşan ödemeler <a data-sub="recurring">Tümü</a></h3>`+up.map(r=>{const c=cat(r.catId);return `<div class="row" data-act="editrec" data-id="${r.id}"><div class="ico" style="background:${c.color}22">${c.icon}</div><div class="grow"><div class="t1">${esc(r.name)}</div><div class="t2">${dLabel(r.next)}</div></div><div class="amt ${r.type==="income"?"inc":"exp"}">${fmt(r.amount)}</div></div>`}).join("")+`</div>`; }
  h+=`<div class="card"><h3>Son işlemler <a data-tab="tx">Tümü</a></h3>${last.length?last.map(txRow).join(""):emptyBox("🧾","Kayıt yok")}</div>`;
  h+=`<div class="card menu"><h3>Yönet</h3>
   ${menuRow("accounts","👛","Hesaplar","Nakit, banka, kart bakiyeleri")}
   ${menuRow("recurring","🔄","Tekrarlayan işlemler","Maaş, kira, abonelik otomatik eklenir")}
   ${menuRow("goals","🏆","Birikim hedefleri","Hedef belirle, ilerlemeyi gör")}
   ${menuRow("categories","🏷️","Kategoriler","Ekle, düzenle")}
   ${menuRow("backup","💾","Yedekleme & dışa aktarma","JSON yedek, Excel (CSV)")}</div></div>`;
  return h;
}
const menuRow=(s,ic,t,d)=>`<div class="row" data-sub="${s}"><div class="ico">${ic}</div><div class="grow"><div class="t1">${t}</div><div class="t2">${d}</div></div><span class="mut">›</span></div>`;

function vTx(){
  let list=monthTx(month);
  const f=txFilter; if(f.type!=="all") list=list.filter(t=>t.type===f.type);
  if(f.cat) list=list.filter(t=>t.catId===f.cat);
  if(f.q){ const q=f.q.toLocaleLowerCase("tr"); list=list.filter(t=>((t.note||"")+" "+(t.type==="transfer"?"transfer":cat(t.catId).name)+" "+acc(t.accId).name+" "+t.amount).toLocaleLowerCase("tr").includes(q)); }
  list=sortTx(list);

function donut(data){
  const tot=data.reduce((a,d)=>a+d.v,0); if(!tot) return "";
  let a=-Math.PI/2, p=""; const R=70,r=44,cx=90,cy=90;
  if(data.length===1) p=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${data[0].c}" stroke-width="${R-r}"/>`;
  else for(const d of data){ const a2=a+d.v/tot*Math.PI*2, lg=a2-a>Math.PI?1:0;
    const P=(rad,ang)=>(cx+rad*Math.cos(ang)).toFixed(2)+" "+(cy+rad*Math.sin(ang)).toFixed(2);
    p+=`<path d="M${P(R,a)} A${R} ${R} 0 ${lg} 1 ${P(R,a2)} L${P(r,a2)} A${r} ${r} 0 ${lg} 0 ${P(r,a)}Z" fill="${d.c}"/>`; a=a2; }
  return `<svg viewBox="0 0 180 180" width="180" height="180" style="display:block;margin:0 auto">${p}<text x="90" y="86" text-anchor="middle" style="font-size:11px">Toplam gider</text><text x="90" y="104" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--text)">${esc(fmt(tot))}</text></svg>`;
}
function bars6(){
  const ks=[]; for(let i=5;i>=0;i--) ks.push(mShift(month,-i));
  const ds_=ks.map(k=>sums(k)); const mx=Math.max(1,...ds_.map(d=>Math.max(d.inc,d.exp)));
  const W=320,H=150,bw=16; let g="";
  ks.forEach((k,i)=>{ const x=20+i*50, d=ds_[i]; const hi=d.inc/mx*110, he=d.exp/mx*110;
    g+=`<rect x="${x}" y="${120-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)"/><rect x="${x+bw+2}" y="${120-he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)"/><text x="${x+bw}" y="136" text-anchor="middle" ${k===month?'style="font-weight:700;fill:var(--text)"':""}>${MONTHS[+k.slice(5)-1].slice(0,3)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="10" y1="120" x2="${W-6}" y2="120" stroke="var(--line)"/>${g}</svg><div class="t2" style="text-align:center"><span class="inc">■</span> Gelir &nbsp; <span class="exp">■</span> Gider</div>`;
}
function vReports(){
  const bc=byCat(month); const s=sums(month); const prev=byCat(mShift(month,-1)); const ps=sums(mShift(month,-1));
  const data=Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({id,v,c:cat(id).color}));
  const isCur=month===mk(today()); const dn=isCur?new Date().getDate():daysIn(month);
  const perDay={}; monthTx(month).forEach(t=>{ if(t.type==="expense") perDay[t.date]=(perDay[t.date]||0)+t.amount; });
  const maxDay=Object.entries(perDay).sort((a,b)=>b[1]-a[1])[0];
  const rate=s.inc>0?(s.net/s.inc*100):null;
  let h=monthNav()+`<div class="wrap"><div class="card"><h3>Gider dağılımı</h3>`;
  if(!data.length) h+=emptyBox("📊","Bu ay gider kaydı yok");
  else { h+=donut(data)+`<div class="legend">`+data.map(d=>{const c=cat(d.id), pv=prev[d.id]||0, ch=pv?((d.v-pv)/pv*100):null;
      return `<div class="row"><span class="dot" style="background:${d.c}"></span><div class="grow"><div class="t1">${c.icon} ${esc(c.name)}</div><div class="t2">%${nf2.format(d.v/s.exp*100)}${ch!==null?` · geçen aya göre <span class="${ch>0?"exp":"inc"}">${ch>0?"▲":"▼"}%${nf2.format(Math.abs(ch))}</span>`:""}</div></div><b>${fmt(d.v)}</b></div>`}).join("")+`</div>`; }
  h+=`</div><div class="card"><h3>Son 6 ay</h3>${bars6()}</div>
  <div class="card"><h3>Özet istatistikler</h3><div class="stat">
   <div><small>Günlük ort. gider</small><b>${fmt(s.exp/dn)}</b></div>
   <div><small>Tasarruf oranı</small><b class="${rate!==null&&rate<0?"exp":"inc"}">${rate===null?"—":"%"+nf2.format(rate)}</b></div>
   <div><small>En pahalı gün</small><b>${maxDay?fmt(maxDay[1]):"—"}</b>${maxDay?`<small>${dLabel(maxDay[0])}</small>`:""}</div>
   <div><small>Geçen aya göre gider</small><b class="${!ps.exp?"":s.exp>ps.exp?"exp":"inc"}">${ps.exp?(s.exp>ps.exp?"▲ ":"▼ ")+fmt(Math.abs(s.exp-ps.exp)):"—"}</b></div>
   ${isCur&&dn<daysIn(month)?`<div style="grid-column:1/-1"><small>Bu hızla ay sonu tahmini gider</small><b>${fmt(s.exp/dn*daysIn(month))}</b></div>`:""}
  </div></div>`;
  const ins=insights(s,ps,bc); if(ins.length) h+=`<div class="card"><h3>💡 Öneriler</h3>${ins.map(x=>`<div class="tip" style="padding:5px 0">• ${x}</div>`).join("")}</div>`;
  return h+`</div>`;
}
function insights(s,ps,bc){
  const r=[];
  if(s.inc>0 && s.exp>s.inc) r.push(`Bu ay giderin gelirini <b class="exp">${fmt(s.exp-s.inc)}</b> aşıyor.`);
  if(s.inc>0 && s.net/s.inc>=.2) r.push("Gelirinin en az %20'sini biriktiriyorsun, harika gidiyorsun.");
  for(const [id,v] of Object.entries(bc)){ const l=S.budgets[id]; if(l&&v>l) r.push(`${cat(id).icon} ${esc(cat(id).name)} limitini ${fmt(v-l)} aştın.`); }
  const subs=S.recurring.filter(x=>x.active&&x.type==="expense"); if(subs.length){ const m=subs.reduce((a,x)=>a+(x.freq==="weekly"?x.amount*52/12:x.freq==="yearly"?x.amount/12:x.amount),0); r.push(`Düzenli giderlerin aylık yaklaşık <b>${fmt(m)}</b> tutuyor. Kullanmadığın abonelik var mı?`); }
  if(!Object.keys(S.budgets).length && s.exp>0) r.push("Bütçe sekmesinden en çok harcadığın kategorilere limit koymayı dene.");
  return r.slice(0,5);
}

function confirmBox(msg,yes,label){ openSheet(`<h2>Emin misin?</h2><p class="tip">${msg}</p><div class="btns"><button class="btn sec" id="cn">Vazgeç</button><button class="btn" style="background:var(--exp)" id="cy">${label||"Sil"}</button></div>`,sh=>{ sh.querySelector("#cn").onclick=closeSheet; sh.querySelector("#cy").onclick=()=>{ closeSheet(); yes(); }; }); }
const accOpts=(sel)=>S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${a.icon||""} ${esc(a.name)}</option>`).join("");

function txSheet(id,preset){

  let type = t?t.type:(preset&&preset.type)||"expense";
  let catId = t?t.catId:null;

    ${type==="transfer"?`<div class="two"><div><label class="f">Nereden</label><select id="acc">${accOpts(t?t.accId:S.accounts[1]&&S.accounts[1].id)}</select></div><div><label class="f">Nereye</label><select id="acc2">${accOpts(t?t.toAccId:S.accounts[0]&&S.accounts[0].id)}</select></div></div>`
      :`<label class="f">Kategori</label><div class="catgrid">${cats.map(c=>`<div class="cat ${c.id===catId?"on":""}" data-cat="${c.id}"><span>${c.icon}</span>${esc(c.name)}</div>`).join("")}</div>
      <label class="f">Hesap</label><select id="acc">${accOpts(t?t.accId:(S.lastAcc||S.accounts[0]&&S.accounts[0].id))}</select>`}
    <div class="two"><div><label class="f">Tarih</label><input type="date" id="date" value="${t?t.date:today()}"></div><div><label class="f">Not</label><input id="note" placeholder="İsteğe bağlı" value="${t?esc(t.note||""):""}"></div></div>
    ${!t&&type!=="transfer"?`<label class="f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="rep" style="width:auto"> Tekrarlayan yap <select id="freq" style="width:auto;padding:6px 8px;margin-left:auto"><option value="monthly">Her ay</option><option value="weekly">Her hafta</option><option value="yearly">Her yıl</option></select></label>`:""}
    <div class="btns">${t?`<button class="btn del" id="del" style="flex:0 0 32%">Sil</button>`:""}<button class="btn" id="ok">Kaydet</button></div>`;
  };
  const mount=sh=>{
    const keep=()=>({a:sh.querySelector("#amt").value,d:sh.querySelector("#date").value,n:sh.querySelector("#note").value});
    sh.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{ const k=keep(); type=b.dataset.ty; sh.innerHTML=`<div class="grab"></div>`+draw(); sh.querySelector("#amt").value=k.a; sh.querySelector("#date").value=k.d; sh.querySelector("#note").value=k.n; mount(sh); });
    sh.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ catId=b.dataset.cat; sh.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x===b)); });
    if(!t) setTimeout(()=>{ const a=sh.querySelector("#amt"); if(a&&!a.value) a.focus(); },120);
    const del=sh.querySelector("#del"); if(del) del.onclick=()=>confirmBox("Bu işlem silinecek.",()=>{ S.tx=S.tx.filter(x=>x.id!==id); save(); render(); toast("Silindi"); });
    sh.querySelector("#ok").onclick=()=>{
      const amount=parseAmt(sh.querySelector("#amt").value); if(!(amount>0)) return toast("Tutar gir");
      const date=sh.querySelector("#date").value||today(); const note=sh.querySelector("#note").value.trim();
      const accId=sh.querySelector("#acc").value; let o;
      if(type==="transfer"){ const to=sh.querySelector("#acc2").value; if(to===accId) return toast("Farklı iki hesap seç"); o={type,amount,accId,toAccId:to,date,note}; }
      else { if(!catId) return toast("Kategori seç"); o={type,amount,catId,accId,date,note}; S.lastAcc=accId; }
      if(t){ Object.assign(t,o); if(type==="transfer") delete t.catId; else delete t.toAccId; }
      else {
        const rep=sh.querySelector("#rep");
        if(rep&&rep.checked){ const fq=sh.querySelector("#freq").value; const r={id:uid(),name:note||cat(catId).name,type,amount,catId,accId,freq:fq,day:pd(date).getDate(),next:date,active:true}; S.recurring.push(r);
          if(date<=today()){ S.tx.push({id:uid(),ts:Date.now(),...o,recId:r.id}); advance(r); } }
        else S.tx.push({id:uid(),ts:Date.now(),...o});
        if(mk(date)!==month) month=mk(date);
      }
      save(); closeSheet(); render(); toast(t?"Güncellendi":"Kaydedildi ✓");
      if(!t&&type==="expense"){ const l=S.budgets[catId]; if(l){ const sp=byCat(mk(date))[catId]||0; if(sp>l) setTimeout(()=>toast("⚠️ "+cat(catId).name+" bütçesi aşıldı!"),2300); else if(sp/l>=.8) setTimeout(()=>toast("Dikkat: "+cat(catId).name+" bütçesinin %"+Math.round(sp/l*100)+"'i doldu"),2300); } }
    };
  };
  openSheet(draw(),mount);
}
function budSheet(id){
  const c=cat(id); const cur=S.budgets[id]||"";
  const avg=[1,2,3].map(i=>byCat(mShift(mk(today()),-i))[id]||0); const a=avg.reduce((x,y)=>x+y,0)/3;
  openSheet(`<h2>${c.icon} ${esc(c.name)} limiti</h2><p class="tip">Aylık en fazla ne kadar harcamak istiyorsun?${a>0?` Son 3 ay ortalaman: <b>${fmt(a)}</b>`:""}</p><input class="amtin" id="lim" inputmode="decimal" placeholder="0 ₺" value="${cur?nf2.format(cur):""}">
  <div class="btns">${cur?`<button class="btn del" id="rm" style="flex:0 0 38%">Limiti kaldır</button>`:""}<button class="btn" id="ok">Kaydet</button></div>`,sh=>{
    setTimeout(()=>{ const l=sh.querySelector("#lim"); if(l) l.focus(); },120);
    const rm=sh.querySelector("#rm"); if(rm) rm.onclick=()=>{ delete S.budgets[id]; save(); closeSheet(); render(); };
    sh.querySelector("#ok").onclick=()=>{ const v=parseAmt(sh.querySelector("#lim").value); if(!(v>0)) return toast("Tutar gir"); S.budgets[id]=v; save(); closeSheet(); render(); toast("Limit kaydedildi"); };
  });
}
function accSheet(id){
  const a=id?S.accounts.find(x=>x.id===id):null;
  openSheet(`<h2>${a?"Hesabı düzenle":"Yeni hesap"}</h2><div class="two" style="grid-template-columns:70px 1fr"><div><label class="f">Simge</label><input id="ic" value="${a?a.icon:"👛"}" maxlength="4" style="text-align:center;font-size:20px"></div><div><label class="f">Ad</label><input id="nm" value="${a?esc(a.name):""}" placeholder="Örn. Ziraat, Altın…"></div></div>
  <label class="f">Açılış bakiyesi (şu an hesapta olan)</label><input id="op" inputmode="decimal" value="${a?nf2.format(a.opening):""}" placeholder="0">
  <p class="tip">Kredi kartı borcu için eksi değer gir (örn. -2500).</p>
  <div class="btns">${a?`<button class="btn del" id="del" style="flex:0 0 32%">Sil</button>`:""}<button class="btn" id="ok">Kaydet</button></div>`,sh=>{
    const del=sh.querySelector("#del"); if(del) del.onclick=()=>{ const used=S.tx.some(t=>t.accId===id||t.toAccId===id); if(used) return toast("Bu hesapta işlem var, önce işlemleri sil"); if(S.accounts.length<2) return toast("En az bir hesap olmalı"); confirmBox("Hesap silinecek.",()=>{ S.accounts=S.accounts.filter(x=>x.id!==id); save(); render(); }); };
    sh.querySelector("#ok").onclick=()=>{ const nm=sh.querySelector("#nm").value.trim(); if(!nm) return toast("Ad gir"); let raw=sh.querySelector("#op").value.trim(); const neg=raw.startsWith("-")||raw.startsWith("−"); let op=parseAmt(raw.replace(/^[-−]/,"")); if(!isFinite(op)) op=0; if(neg) op=-op;
      const o={name:nm,icon:sh.querySelector("#ic").value.trim()||"👛",opening:op}; if(a) Object.assign(a,o); else S.accounts.push({id:uid(),...o}); save(); closeSheet(); render(); };
  });
}
function recSheet(id){
  const r=id?S.recurring.find(x=>x.id===id):null; let type=r?r.type:"expense";
  const draw=()=>`<h2>${r?"Tekrarlayanı düzenle":"Yeni tekrarlayan"}</h2>
   <div class="seg"><button data-ty="expense" class="${type==="expense"?"on e":""}">Gider</button><button data-ty="income" class="${type==="income"?"on i":""}">Gelir</button></div>
   <label class="f">Ad</label><input id="nm" value="${r?esc(r.name):""}" placeholder="Örn. Kira, Maaş, Netflix">
   <div class="two"><div><label class="f">Tutar</label><input id="am" inputmode="decimal" value="${r?nf2.format(r.amount):""}"></div><div><label class="f">Sıklık</label><select id="fq">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${r&&r.freq===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
   <div class="two"><div><label class="f">Kategori</label><select id="ct">${S.categories.filter(c=>c.kind===type).map(c=>`<option value="${c.id}" ${r&&r.catId===c.id?"selected":""}>${c.icon} ${esc(c.name)}</option>`).join("")}</select></div><div><label class="f">Hesap</label><select id="ac">${accOpts(r?r.accId:S.accounts[0]&&S.accounts[0].id)}</select></div></div>
   <label class="f">${r?"Sonraki tarih":"İlk tarih"}</label><input type="date" id="dt" value="${r?r.next:today()}">
   ${r?`<label class="f" style="display:flex;align-items:center;justify-content:space-between">Aktif <button class="switch ${r.active?"on":""}" id="sw"></button></label>`:""}
   <div class="btns">${r?`<button class="btn del" id="del" style="flex:0 0 32%">Sil</button>`:""}<button class="btn" id="ok">Kaydet</button></div>`;
  let active=r?r.active:true;
  const mount=sh=>{
    sh.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{ type=b.dataset.ty; sh.innerHTML=`<div class="grab"></div>`+draw(); mount(sh); });
    const sw=sh.querySelector("#sw"); if(sw) sw.onclick=()=>{ active=!active; sw.classList.toggle("on",active); };
    const del=sh.querySelector("#del"); if(del) del.onclick=()=>confirmBox("Tekrarlayan kural silinecek. Daha önce eklenmiş işlemler kalır.",()=>{ S.recurring=S.recurring.filter(x=>x.id!==id); save(); render(); });
    sh.querySelector("#ok").onclick=()=>{ const am=parseAmt(sh.querySelector("#am").value); const nm=sh.querySelector("#nm").value.trim(); if(!nm) return toast("Ad gir"); if(!(am>0)) return toast("Tutar gir");
      const dt=sh.querySelector("#dt").value||today();
      const o={name:nm,type,amount:am,freq:sh.querySelector("#fq").value,catId:sh.querySelector("#ct").value,accId:sh.querySelector("#ac").value,next:dt,day:pd(dt).getDate(),active};
      if(r) Object.assign(r,o); else S.recurring.push({id:uid(),...o});
      save(); closeSheet(); runRecurring(); render(); toast("Kaydedildi"); };
  };
  openSheet(draw(),mount);
}
function goalSheet(id){
  const g=id?S.goals.find(x=>x.id===id):null;
  openSheet(`<h2>${g?esc(g.name):"Yeni hedef"}</h2>
  ${g?`<label class="f">Hedefe para ekle / çıkar</label><div class="two" style="grid-template-columns:1fr auto auto"><input id="add" inputmode="decimal" placeholder="Tutar"><button class="btn sm" id="plus">+ Ekle</button><button class="btn sm sec" id="minus">− Çıkar</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0 4px">`:""}
  <div class="two" style="grid-template-columns:70px 1fr"><div><label class="f">Simge</label><input id="ic" value="${g?g.icon:"🏆"}" maxlength="4" style="text-align:center;font-size:20px"></div><div><label class="f">Ad</label><input id="nm" value="${g?esc(g.name):""}" placeholder="Örn. Tatil, Acil durum fonu"></div></div>
  <div class="two"><div><label class="f">Hedef tutar</label><input id="tg" inputmode="decimal" value="${g?nf2.format(g.target):""}"></div><div><label class="f">Biriken</label><input id="sv" inputmode="decimal" value="${g?nf2.format(g.saved):"0"}"></div></div>
  <label class="f">Hedef tarih (isteğe bağlı)</label><input type="date" id="dl" value="${g&&g.deadline||""}">
  <div class="btns">${g?`<button class="btn del" id="del" style="flex:0 0 32%">Sil</button>`:""}<button class="btn" id="ok">Kaydet</button></div>`,sh=>{
    const ch=s=>{ const v=parseAmt(sh.querySelector("#add").value); if(!(v>0)) return toast("Tutar gir"); g.saved=Math.max(0,g.saved+s*v); save(); closeSheet(); render(); toast(g.saved>=g.target?"🎉 Hedefe ulaştın!":"Güncellendi"); };
    if(g){ sh.querySelector("#plus").onclick=()=>ch(1); sh.querySelector("#minus").onclick=()=>ch(-1);
      sh.querySelector("#del").onclick=()=>confirmBox("Hedef silinecek.",()=>{ S.goals=S.goals.filter(x=>x.id!==id); save(); render(); }); }
    sh.querySelector("#ok").onclick=()=>{ const nm=sh.querySelector("#nm").value.trim(), tg=parseAmt(sh.querySelector("#tg").value); let sv=parseAmt(sh.querySelector("#sv").value); if(!isFinite(sv)) sv=0;
      if(!nm) return toast("Ad gir"); if(!(tg>0)) return toast("Hedef tutar gir");
      const o={name:nm,icon:sh.querySelector("#ic").value.trim()||"🏆",target:tg,saved:sv,deadline:sh.querySelector("#dl").value||""};
      if(g) Object.assign(g,o); else S.goals.push({id:uid(),...o}); save(); closeSheet(); render(); };
  });
}
function catSheet(id,kind){
  const c=id?S.categories.find(x=>x.id===id):null; kind=c?c.kind:kind; let color=c?c.color:COLORS[S.categories.length%COLORS.length];
  openSheet(`<h2>${c?"Kategoriyi düzenle":"Yeni kategori"}</h2><div class="two" style="grid-template-columns:70px 1fr"><div><label class="f">Simge</label><input id="ic" value="${c?c.icon:"🏷️"}" maxlength="4" style="text-align:center;font-size:20px"></div><div><label class="f">Ad</label><input id="nm" value="${c?esc(c.name):""}"></div></div>
  <label class="f">Renk</label><div style="display:flex;flex-wrap:wrap;gap:8px">${COLORS.map(x=>`<button data-col="${x}" style="width:30px;height:30px;border-radius:50%;border:3px solid ${x===color?"var(--text)":"transparent"};background:${x};cursor:pointer"></button>`).join("")}</div>
  <div class="btns">${c?`<button class="btn del" id="del" style="flex:0 0 32%">Sil</button>`:""}<button class="btn" id="ok">Kaydet</button></div>`,sh=>{
    sh.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{ color=b.dataset.col; sh.querySelectorAll("[data-col]").forEach(x=>x.style.borderColor=x===b?"var(--text)":"transparent"); });
    const del=sh.querySelector("#del"); if(del) del.onclick=()=>{ const same=S.categories.filter(x=>x.kind===kind); if(same.length<2) return toast("En az bir kategori kalmalı");
      const n=S.tx.filter(t=>t.catId===id).length; const target=same.find(x=>x.id!==id&&/Diğer/.test(x.name))||same.find(x=>x.id!==id);
      confirmBox(n?`${n} işlem "${esc(target.name)}" kategorisine taşınacak.`:"Kategori silinecek.",()=>{ S.tx.forEach(t=>{ if(t.catId===id) t.catId=target.id; }); S.recurring.forEach(r=>{ if(r.catId===id) r.catId=target.id; }); delete S.budgets[id]; S.categories=S.categories.filter(x=>x.id!==id); save(); render(); }); };
    sh.querySelector("#ok").onclick=()=>{ const nm=sh.querySelector("#nm").value.trim(); if(!nm) return toast("Ad gir"); const o={name:nm,icon:sh.querySelector("#ic").value.trim()||"🏷️",color};
      if(c) Object.assign(c,o); else S.categories.push({id:uid(),kind,...o}); save(); closeSheet(); render(); };
  });
}

/* ---------- dosya / yedek ---------- */
let downloadsCap=null;
async function saveFile(name,mime,text){
  try{ if(window.AndroidBridge&&AndroidBridge.saveFile){ const r=AndroidBridge.saveFile(name,mime,text); toast(r||"İndirilenler klasörüne kaydedildi"); return; } }catch(e){}
  if(downloadsCap){ try{ await downloadsCap.save({filename:name,data:text}); return; }catch(e){ try{ await downloadsCap.save({filename:name,data:new Blob([text],{type:mime})}); return; }catch(e2){} } }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  copyText(text,"İndirme açılamadıysa içerik panoya kopyalandı");
}
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg||"Panoya kopyalandı"); }catch(e){ toast("Kopyalanamadı"); } }
function csv(list){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[["Tarih","Tür","Kategori","Hesap","Hedef hesap","Tutar","Not"]];
  sortTx(list).reverse().forEach(t=>rows.push([t.date,{income:"Gelir",expense:"Gider",transfer:"Transfer"}[t.type],t.type==="transfer"?"":cat(t.catId).name,acc(t.accId).name,t.type==="transfer"?acc(t.toAccId).name:"",String(t.type==="expense"?-t.amount:t.amount).replace(".",","),t.note||""]));
  return "﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n");
}
$("#filein").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d||!Array.isArray(d.tx)||!Array.isArray(d.categories)) throw 0;
  confirmBox(`Yedekte ${d.tx.length} işlem var. Mevcut verilerin yerine geçecek.`,()=>{ S=Object.assign(defaults(),d); save(); render(); toast("Yedek geri yüklendi ✓"); },"Geri yükle"); }catch(err){ toast("Geçersiz yedek dosyası"); } e.target.value=""; }; rd.readAsText(f); };

/* ---------- olaylar ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb&&!e.target.closest("#sheet")){ tab=tb.dataset.tab; sub=null; render(); window.scrollTo(0,0); return; }
  const sb=e.target.closest("[data-sub]"); if(sb){ sub=sb.dataset.sub; render(); window.scrollTo(0,0); return; }
  const el=e.target.closest("[data-act]"); if(!el||el.closest("#sheet")) return;
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case "add": txSheet(); break;
    case "back": sub=null; render(); break;
    case "mprev": month=mShift(month,-1); render(); break;
    case "mnext": month=mShift(month,1); render(); break;
    case "edittx": txSheet(id); break;
    case "ftype": txFilter.type=el.dataset.v; render(); break;
    case "setbud": budSheet(id); break;
    case "editacc": accSheet(id); break;
    case "transfer": txSheet(null,{type:"transfer"}); break;
    case "editrec": recSheet(id); break;
    case "editgoal": goalSheet(id); break;
    case "editcat": catSheet(id,el.dataset.kind); break;
    case "expjson": saveFile("butcem-yedek-"+today()+".json","application/json",JSON.stringify(S,null,1)); break;
    case "copyjson": copyText(JSON.stringify(S),"Yedek panoya kopyalandı"); break;
    case "impjson": $("#filein").click(); break;
    case "expcsv": saveFile("butcem-"+(el.dataset.v==="all"?"tum":month)+".csv","text/csv",csv(el.dataset.v==="all"?S.tx:monthTx(month))); break;
    case "reset": confirmBox("Tüm işlemler, hesaplar, hedefler silinecek. Geri alınamaz.",()=>{ S=defaults(); save(); render(); toast("Sıfırlandı"); }); break;
  }
});
// Android geri tuşu
window.appBack=function(){ if($("#sheet").style.display==="block"){ closeSheet(); return true; } if(sub){ sub=null; render(); return true; } if(tab!=="home"){ tab="home"; render(); return true; } return false; };

/* ---------- bulut senkron (claude.ai sayfasında) ---------- */
let cloud=null, pushing=false, again=false; const written={};
function chunks(){
  const m={}; S.tx.forEach(t=>{ const k="tx-"+mk(t.date); (m[k]=m[k]||[]).push(t); });
  const meta={v:S.v,updatedAt:S.updatedAt,accounts:S.accounts,categories:S.categories,budgets:S.budgets,recurring:S.recurring,goals:S.goals,lastAcc:S.lastAcc||null,months:Object.keys(m)};
  const out={meta}; for(const k in m) out[k]={items:m[k]}; return out;
}
async function cloudPush(){
  if(!cloud) return; if(pushing){ again=true; return; } pushing=true;
  try{ do{ again=false; const c=chunks();
      for(const k of Object.keys(written)) if(!c[k]){ await cloud.col.doc(k).delete(); delete written[k]; }
      for(const k of Object.keys(c).sort((a,b)=>a==="meta"?1:b==="meta"?-1:0)){ const j=JSON.stringify(c[k]); if(written[k]!==j){ await cloud.col.doc(k).set(c[k]); written[k]=j; } }
    }while(again); syncBadge("☁️ Senkron");
  }catch(e){ syncBadge(e&&e.code==="quota_exceeded"?"⚠️ Bulut dolu":"⚠️ Çevrimdışı"); }
  pushing=false;
}
function syncBadge(t){ const b=$("#sync"); b.textContent=t; b.style.display=""; }
async function cloudInit(){
  if(window.AndroidBridge||!window.claude||!claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const col=db.collection("data/users/"+id);
    const ms=await col.doc("meta").get();
    if(ms.exists){ const meta=ms.data();
      const months=Array.isArray(meta.months)?meta.months:[]; const tx=[];
      for(const k of months){ const s=await col.doc(k).get(); if(s.exists){ const d=s.data(); written[k]=JSON.stringify(d); (d.items||[]).forEach(x=>tx.push(x)); } }
      written.meta=JSON.stringify(meta);
      if((meta.updatedAt||0)>(S.updatedAt||0)){ const n=Object.assign(defaults(),JSON.parse(JSON.stringify(meta))); delete n.months; n.tx=JSON.parse(JSON.stringify(tx)); S=n; lsSet(); runRecurring(); render(); }
    }
    cloud={col}; syncBadge("☁️ Senkron");
    if(!ms.exists || (S.updatedAt||0)>((ms.exists&&ms.data().updatedAt)||0)) cloudPush();
  }catch(e){}
}
(async()=>{ try{ if(window.claude&&claude.use&&!window.AndroidBridge) downloadsCap=await claude.use("downloads"); }catch(e){} })();

runRecurring();
render();
cloudInit();
})();
</script>
