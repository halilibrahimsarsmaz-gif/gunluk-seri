plugins { id 'com.android.application' }
android {
    namespace 'com.gunlukseri.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gunlukseri.app'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'none.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'gunlukseri'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
