<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Günlük Seri</title>
<style>
@font-face{font-family:"Bricolage";font-weight:800;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Bricolage";font-weight:800;src:url(fonts/bricolage-grotesque-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage";font-weight:500;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Bricolage";font-weight:500;src:url(fonts/bricolage-grotesque-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Instrument";font-weight:400;src:url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Instrument";font-weight:400;src:url(fonts/instrument-sans-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Instrument";font-weight:600;src:url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Instrument";font-weight:600;src:url(fonts/instrument-sans-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* Düzen: ana ekran yalnızca yazı — sıradaki alışkanlık dev harflerle ortada, yukarı itilince uçup gider. Rapor, sağdan açılan ayrı panel. */
:root{
  --bg:#eef0ec; --fg:#191c1a; --muted:#6a716c; --faint:#b9beb9; --line:rgba(25,28,26,.12); --panel:#f7f8f5;
  --sat:68%; --strong-l:40%; --soft-l:86%;
  --display:"Bricolage","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111312; --fg:#eef1ed; --muted:#9aa29c; --faint:#3b413d; --line:rgba(238,241,237,.13); --panel:#181b19;
  --sat:55%; --strong-l:66%; --soft-l:22%; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* ---------- ana ekran ---------- */
.app{height:100%;display:flex;flex-direction:column;padding:18px 22px 22px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.date{font-size:13px;color:var(--muted);letter-spacing:.02em}
.date b{color:var(--fg);font-weight:600}
.menu{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:10px 0 10px 12px}
.menu svg{width:20px;height:20px}
.acts{display:flex;align-items:center;gap:4px}
.plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg)}
.plus svg{width:22px;height:22px}
.prog{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* makara: üç satır görünür, 3B silindir üzerinde döner */
.stage{flex:1;position:relative;touch-action:none;min-height:0;overflow:hidden;perspective:1100px;
  -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.reel{position:absolute;inset:0;transform-style:preserve-3d}
.row{position:absolute;left:0;right:0;top:50%;will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer}
.row .t{font-family:var(--display);font-weight:800;font-size:var(--fs);letter-spacing:-.035em;line-height:1.02;overflow-wrap:anywhere;
  color:hsl(var(--h) var(--sat) var(--strong-l));
  background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0% .085em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  transition:background-size .45s cubic-bezier(.6,0,.2,1)}
.row.done .t{background-size:100% .085em}
.row .line{display:flex;gap:14px;align-items:flex-start}
.tick{flex:none;width:40px;height:40px;border-radius:50%;border:2.5px solid hsl(var(--h) var(--sat) var(--strong-l));color:transparent;display:grid;place-items:center;
  margin-top:calc((var(--fs) * 1.02 - 40px) / 2);transition:background .25s,color .25s,transform .15s}
.tick svg{width:22px;height:22px}
.tick:active{transform:scale(.88)}
.row.done .tick{background:hsl(var(--h) var(--sat) var(--strong-l));color:var(--bg)}
.row .sub{display:flex;gap:14px;margin-top:10px;margin-left:54px;font-size:13px;color:var(--muted);align-items:center}
.row .sub .bell{display:inline-flex;align-items:center;gap:4px}
.row .sub svg{width:13px;height:13px}
.row .sub b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.row .sub .ok{color:hsl(var(--h) var(--sat) var(--strong-l));font-weight:600}

.hint{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:13px;color:var(--muted);min-height:44px}
.hint .up{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:600;padding:10px 0}
.hint .up svg{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hint .open{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:4px;padding:10px 0}
.hint .back{padding:10px 0}

.empty h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,15vw,92px);line-height:.92;letter-spacing:-.04em;margin:0;text-wrap:balance}
.empty p{color:var(--muted);margin:14px 0 0;font-size:15px;line-height:1.5;max-width:30ch}
.empty{display:flex;flex-direction:column;justify-content:center;-webkit-mask-image:none;mask-image:none;touch-action:auto}
.empty form{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sugs button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:14px}

.toast{position:fixed;left:22px;right:22px;bottom:22px;background:var(--fg);color:var(--bg);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;transform:translateY(calc(100% + 60px));transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:20}
.toast.show{transform:none}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{font-weight:600;color:var(--bg);text-decoration:underline;text-underline-offset:3px;flex:none;padding:4px}

/* ---------- hızlı ekleme ---------- */
.qa-back{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.qa-back.open{opacity:1;pointer-events:auto}
.qa{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 22px 22px;display:flex;flex-direction:column;gap:16px;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.12);margin:0}
.qa.open{transform:none}
.qa .grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.qa h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0}
.qa .lab{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.qa .lab svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;position:relative;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.chip input[type=time]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* ---------- rapor paneli ---------- */
.sheet{position:fixed;inset:0;background:var(--panel);z-index:10;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;user-select:text;-webkit-user-select:text}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px;border-bottom:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:0}
.sheet .close{font-weight:600;padding:10px 0 10px 12px}
.tabs{display:flex;gap:6px;padding:12px 22px 0}
.tabs button{padding:8px 14px;border-radius:99px;font-size:14px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--panel)}
.body{flex:1;overflow-y:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:28px}
.sec h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 9px var(--body)}
.chart .lbl{fill:var(--fg);font-weight:600}
.hab{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.hab .name{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hab .name strong{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.05;color:hsl(var(--h) var(--sat) var(--strong-l));overflow-wrap:anywhere;min-width:0}
.hab .stats{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.hab .stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font-size:10px;text-align:center;color:var(--muted);letter-spacing:.05em}
.day{aspect-ratio:1;border-radius:6px;background:hsl(var(--h) 20% var(--soft-l));font:500 10px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:hsl(var(--h) var(--sat) var(--strong-l));color:var(--panel)}
.day.today{box-shadow:inset 0 0 0 2px var(--fg)}
.day.future{visibility:hidden}
.rem{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rem svg{width:15px;height:15px}
.rem input[type=time]{font:600 14px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-variant-numeric:tabular-nums}
.rem .off{text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.warn{background:hsl(30 90% 55% / .14);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;justify-content:space-between;gap:12px;align-items:center}
.warn button{font-weight:600;text-decoration:underline;text-underline-offset:3px;flex:none}
.del{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0;flex:none}
.confirm{display:flex;gap:14px;font-size:13px;align-items:center;flex:none}
.confirm button{font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],textarea{width:100%;font:500 17px var(--body);padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);user-select:text;-webkit-user-select:text}
textarea{font-size:12px;font-family:ui-monospace,monospace;min-height:90px;resize:vertical}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;background:hsl(var(--h) var(--sat) var(--strong-l))}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.primary{background:var(--fg);color:var(--bg);border-radius:12px;padding:14px;font-weight:600;font-size:16px;width:100%}
.ghost{border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:14px;width:100%}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<section class="sheet" id="sheet" aria-label="Rapor" aria-hidden="true"></section>
<div class="qa-back" id="qaBack" data-qa-close></div>
<form class="qa" id="qa" aria-label="Yeni alışkanlık" aria-hidden="true">
  <div class="grab"></div>
  <h3>Yeni alışkanlık</h3>
  <input type="text" id="qaName" maxlength="40" placeholder="Her gün ne yapmak istiyorsun?" autocomplete="off" enterkeyhint="done">
  <div><div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 21h4"/></svg>Hatırlatma</div>
    <div class="chips" id="qaChips"></div></div>
  <button class="primary" type="submit">Ekle</button>
</form>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="undo">Geri al</button></div>

<script>
const HUES=[150,22,212,335,45,270,188,0];
const WD=["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
const LS="gunluk-seri-v1";
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

let state={habits:[]};
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&Array.isArray(s.habits))state=s}catch(e){}
let skipped=[],lastDone=null,toastT=0,tab="ozet",pendingDel=null,newHue=HUES[0],dayStamp=key(today());

function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}syncNative()}
function syncNative(){try{if(window.App&&App.sync){const tk=key(today());
  App.sync(JSON.stringify(state.habits.filter(h=>h.rem).map(h=>({id:h.id,name:h.name,time:h.rem}))),tk,state.habits.filter(h=>h.days[tk]).map(h=>h.id).join(","))}}catch(e){}}
const notifOk=()=>{try{return !window.App||!App.notifOk||App.notifOk()}catch(e){return true}};
const BELL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 21h4"/></svg>`;
const CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function streak(h){let d=today();if(!h.days[key(d)])d=addDays(d,-1);let n=0;while(h.days[key(d)]){n++;d=addDays(d,-1)}return n}
function best(h){const ks=Object.keys(h.days).sort();let b=0,r=0,prev=null;for(const k of ks){const d=new Date(k+"T00:00");r=prev&&key(addDays(prev,1))===k?r+1:1;b=Math.max(b,r);prev=d}return b}
function weekCount(h){const t=today(),mon=addDays(t,-((t.getDay()+6)%7));let n=0;for(let i=0;i<7;i++)if(h.days[key(addDays(mon,i))])n++;return n}
function pct(h,n){let c=0;for(let i=0;i<n;i++)if(h.days[key(addDays(today(),-i))])c++;return Math.round(c/n*100)}
function fs(name){const L=name.length;return L<=12?"min(13vw,84px)":L<=22?"min(10.5vw,66px)":"min(8.2vw,50px)"}
function allDone(){const tk=key(today());return state.habits.length>0&&state.habits.every(h=>h.days[tk])}
function firstOpen(){const tk=key(today()),i=state.habits.findIndex(h=>!h.days[tk]);return i<0?Math.max(0,state.habits.length-1):i}

/* ---------- ana ekran: makara ---------- */
let idx=-1,off=0,R=160,STEP=.62,tween=0;
function renderMain(){
  const app=document.getElementById("app"),H=state.habits;
  const date=today().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"}),[d1,...dr]=date.split(" ");
  if(idx<0||idx>H.length-1)idx=firstOpen();off=idx;
  let mid;
  if(!H.length){
    mid=`<div class="stage empty"><h1>İlk alışkanlığını yaz.</h1><p>Her gün yapmak istediğin tek bir şey. Yaptığında yukarı kaydırırsın, makara döner ve üstü çizilir.</p>
    <form id="firstForm"><input type="text" id="firstName" maxlength="40" placeholder="ör. 10 sayfa kitap oku" autocomplete="off" enterkeyhint="done">
    <div class="sugs">${["10 sayfa kitap oku","2 litre su iç","20 dk yürüyüş","Erken yat"].map(s=>`<button type="button" data-sug="${s}">${s}</button>`).join("")}</div>
    <button class="primary" type="submit">Ekle</button></form></div>`;
  }else{
    mid=`<div class="stage" id="stage"><div class="reel" id="reel">${H.map((h,i)=>`
      <div class="row" data-row="${i}" style="--h:${h.h};--fs:${fs(h.name)}"><div class="line"><button class="tick" aria-label="Tamamlandı olarak işaretle">${CHECK}</button><div><span class="t">${esc(h.name)}</span></div></div><div class="sub"></div></div>`).join("")}</div></div>
      <div class="hint" id="hint"></div>`;
  }
  app.innerHTML=`<div class="top"><div class="date"><b>${esc(d1)}</b> ${esc(dr.join(" "))}</div>
    <div class="acts"><button class="menu" data-open aria-label="Raporu aç">Rapor<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-5"/></svg></button>${H.length?`<button class="plus" data-qa aria-label="Alışkanlık ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`:""}</div></div>
    ${H.length?`<div class="prog"><i id="progBar"></i></div>`:""}${mid}`;
  if(H.length){refresh();measure();layout();bindGesture()}
  setBars();
}
function measure(){const st=document.getElementById("stage");if(st)R=Math.max(110,Math.min(st.clientHeight*.36,210))}
function refresh(){
  const H=state.habits,tk=key(today()),n=H.filter(h=>h.days[tk]).length;
  document.querySelectorAll(".row").forEach((el,i)=>{const h=H[i],on=!!h.days[tk];el.classList.toggle("done",on);
    const bell=h.rem?`<span class="bell">${BELL}${h.rem}</span>`:"";
    el.querySelector(".sub").innerHTML=on?`<span class="ok">Bugün tamam</span><span><b>${streak(h)}</b> gün seri</span>${bell}`:`<span><b>${streak(h)}</b> gün seri</span><span>bu hafta <b>${weekCount(h)}/7</b></span>${bell}`});
  const pb=document.getElementById("progBar");if(pb)pb.style.width=(H.length?n/H.length*100:0)+"%";
  const hint=document.getElementById("hint");if(!hint)return;
  const cur=H[idx],up=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>`;
  hint.innerHTML=allDone()?`<span>Bugün hepsi tamam. ${n}/${H.length}</span><button class="open" data-open>Raporu aç</button>`
    :cur&&!cur.days[tk]?`<button class="up" data-done>${up}Yaptıysan yukarı kaydır</button>${idx>0?`<button class="back" data-back>Önceki ↓</button>`:""}`
    :`<button class="up" data-next>${up}Sıradakine geç</button>${idx>0?`<button class="back" data-back>Önceki ↓</button>`:""}`;
}
function layout(){
  document.querySelectorAll(".row").forEach((el,i)=>{
    const p=i-off,a=p*STEP;
    if(Math.abs(p)>2.3){el.style.visibility="hidden";return}
    el.style.visibility="";
    const y=R*Math.sin(a),z=R*(Math.cos(a)-1);
    let o=p<0?(p>=-1?1+.5*p:.5*(2+p)):(p<=1?1-.75*p:.25*(2-p));
    el.style.opacity=Math.max(0,o).toFixed(3);
    el.style.transform=`translateY(calc(-50% + ${y.toFixed(1)}px)) translateZ(${z.toFixed(1)}px) rotateX(${(-a).toFixed(4)}rad)`;
    el.querySelector(".sub").style.opacity=Math.max(0,1-Math.abs(p)*2.2).toFixed(2);
    el.style.pointerEvents=Math.abs(p)<1.5?"":"none";
  });
}
function rollTo(t){
  cancelAnimationFrame(tween);const from=off,to=t,d=reduce?1:520,t0=performance.now();
  const ease=x=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
  const step=now=>{const k=Math.min(1,(now-t0)/d);off=from+(to-from)*ease(k);layout();if(k<1)tween=requestAnimationFrame(step)};
  tween=requestAnimationFrame(step);
}
function setDone(h,on){const k=key(today());if(on)h.days[k]=true;else delete h.days[k];save()}
function complete(){
  const H=state.habits,h=H[idx];if(!h)return;
  if(!h.days[key(today())]){setDone(h,true);lastDone=h.id;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}showToast(`“${h.name}” tamamlandı`,true)}
  if(idx<H.length-1)idx++;
  refresh();rollTo(idx);
}
function goTo(i){idx=Math.max(0,Math.min(state.habits.length-1,i));refresh();rollTo(idx)}
function bindGesture(){
  const st=document.getElementById("stage");if(!st)return;
  let y0=0,t0=0,o0=0,active=false,moved=false,tgt=null;
  st.onpointerdown=e=>{tgt=e.target;active=true;moved=false;y0=e.clientY;t0=performance.now();cancelAnimationFrame(tween);o0=off;st.setPointerCapture(e.pointerId)};
  st.onpointermove=e=>{if(!active)return;const dy=e.clientY-y0;if(Math.abs(dy)>6)moved=true;
    let o=o0-dy/(R*Math.sin(STEP));const max=state.habits.length-1;
    if(o<0)o=o*.35;else if(o>max)o=max+(o-max)*.35;off=o;layout()};
  const end=e=>{if(!active)return;active=false;
    if(!moved){const row=tgt&&tgt.closest&&tgt.closest(".row");
      if(row){const i=+row.dataset.row;
        if(i!==idx){goTo(i);return}
        const h=state.habits[i],on=!h.days[key(today())];
        if(!tgt.closest(".tick")&&!on){rollTo(idx);return}
        setDone(h,on);refresh();
        if(on){lastDone=h.id;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}showToast(`“${h.name}” tamamlandı`,true);
          setTimeout(()=>{if(idx===i&&h.days[key(today())]&&i<state.habits.length-1){idx++;refresh();rollTo(idx)}},520)}}
      else rollTo(idx);return}
    const dlt=off-o0,v=(off-o0)/Math.max(1,performance.now()-t0)*1000;
    if(dlt>.28||v>2.2){
      const steps=Math.max(1,Math.round(dlt));
      if(steps===1)complete();else goTo(idx+steps);
    }else if(dlt<-.28||v<-2.2)goTo(idx+Math.min(-1,Math.round(dlt)));
    else rollTo(idx)};
  st.onpointerup=end;st.onpointercancel=end;
}
addEventListener("resize",()=>{measure();layout()});
function showToast(t,undo){const el=document.getElementById("toast");document.getElementById("toastText").textContent=t;document.getElementById("undo").hidden=!undo;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),4000)}
document.getElementById("undo").onclick=()=>{const i=state.habits.findIndex(x=>x.id===lastDone);if(i>=0){setDone(state.habits[i],false);if(sheetOpen())renderSheet();idx=i;refresh();rollTo(i)}document.getElementById("toast").classList.remove("show")};

/* ---------- rapor ---------- */
const sheet=document.getElementById("sheet");
const sheetOpen=()=>sheet.classList.contains("open");
function openSheet(t){if(t)tab=t;renderSheet();sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");setBars()}
function closeSheet(){sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");pendingDel=null;renderMain()}

function chartSVG(){
  const H=state.habits,N=14,W=300,CH=90,bw=W/N,t=today();let s="";
  for(let i=0;i<N;i++){const d=addDays(t,i-N+1),k=key(d);
    const c=H.filter(h=>h.days[k]).length,r=H.length?c/H.length:0,bh=Math.max(r*CH,2),x=i*bw+3,y=CH-bh+14;
    s+=`<rect x="${x}" y="${y}" width="${bw-6}" height="${bh}" rx="3" fill="${i===N-1?"var(--fg)":"var(--faint)"}"/>`;
    if(c)s+=`<text x="${x+(bw-6)/2}" y="${y-4}" text-anchor="middle" class="${i===N-1?"lbl":""}">${c}</text>`;
    s+=`<text x="${x+(bw-6)/2}" y="${CH+28}" text-anchor="middle"${i===N-1?' class="lbl"':""}>${d.getDate()}</text>`}
  return`<svg viewBox="0 0 ${W} ${CH+34}" role="img" aria-label="Son 14 günde günlük tamamlanan alışkanlık sayısı">${s}</svg>`;
}
function gridHTML(h,idx){
  const t=today(),mon=addDays(t,-((t.getDay()+6)%7)),start=addDays(mon,-28);
  let s=WD.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<35;i++){const d=addDays(start,i),k=key(d),fut=d>t;
    s+=`<button class="day${h.days[k]?" on":""}${+d===+t?" today":""}${fut?" future":""}" data-i="${idx}" data-k="${k}" aria-pressed="${!!h.days[k]}" aria-label="${d.getDate()}.${d.getMonth()+1}"${fut?" tabindex=-1":""}>${d.getDate()}</button>`}
  return s;
}
function renderSheet(){
  const H=state.habits,tk=key(today());
  const doneT=H.filter(h=>h.days[tk]).length;
  let wk=0;const t=today(),mon=addDays(t,-((t.getDay()+6)%7)),days=(t-mon)/864e5+1;H.forEach(h=>wk+=weekCount(h));
  const wkPct=H.length?Math.round(wk/(H.length*days)*100):0,topBest=H.reduce((a,h)=>Math.max(a,best(h)),0);
  let body="";
  if(tab==="ozet"){
    body=H.length?`
    <button class="primary" data-qa>+ Alışkanlık ekle</button>
    <div class="sec kpis"><div class="kpi"><b>${doneT}/${H.length}</b><small>bugün</small></div><div class="kpi"><b>%${wkPct}</b><small>bu hafta</small></div><div class="kpi"><b>${topBest}</b><small>en uzun seri</small></div></div>
    <div class="sec chart"><h3>Son 14 gün</h3>${chartSVG()}</div>
    ${H.map((h,i)=>`<div class="hab" style="--h:${h.h}">
      <div class="name"><strong>${esc(h.name)}</strong>${pendingDel===h.id?`<span class="confirm"><button data-del-yes="${i}">Sil</button><button data-del-no>Vazgeç</button></span>`:`<button class="del" data-del="${i}">Sil</button>`}</div>
      <div class="stats"><span><b>${streak(h)}</b> gün seri</span><span>en iyi <b>${best(h)}</b></span><span>30 gün <b>%${pct(h,30)}</b></span></div>
      <div class="rem">${BELL}<span>Hatırlatma</span><input type="time" id="rem-${h.id}" data-rem="${i}" value="${h.rem||""}" aria-label="Hatırlatma saati">${h.rem?`<button class="off" data-remoff="${i}">Kapat</button>`:`<span>kapalı</span>`}</div>
      <div class="grid">${gridHTML(h,i)}</div></div>`).join("")}
    <p class="note">Geçmiş bir günü unuttuysan takvimde o güne dokun.</p>`
    :`<p class="note">Henüz alışkanlık yok. Ana ekrandaki + ile ilkini ekleyebilirsin.</p>`;
    if(H.some(h=>h.rem)&&!notifOk())body=`<div class="warn"><span>Bildirimler kapalı, hatırlatmalar gelmez.</span><button data-notif>Aç</button></div>`+body;
  }else if(tab==="ekle"){
    body=`<form id="addForm" class="sec" style="display:flex;flex-direction:column;gap:18px">
      <div class="field"><label for="newName">Alışkanlık adı</label><input type="text" id="newName" maxlength="40" placeholder="ör. 5 dk meditasyon" autocomplete="off" enterkeyhint="done"></div>
      <div class="field"><label>Renk</label><div class="sw">${HUES.map(h=>`<button type="button" style="--h:${h}" data-hue="${h}" aria-pressed="${h===newHue}" aria-label="Renk"></button>`).join("")}</div></div>
      <button class="primary" type="submit">Ekle</button></form>
      <p class="note">Ana ekranda sırayla çıkarlar. Bugün yapmayacağın birini aşağı kaydırırsan sona geçer.</p>`;
  }else{
    body=`<div class="sec field"><h3>Yedek al</h3><textarea id="exp" readonly>${esc(JSON.stringify(state))}</textarea><button class="ghost" id="copyBtn">Panoya kopyala</button>
      <p class="note">Veriler yalnızca bu telefonda durur. Uygulamayı silmeden ya da telefon değiştirmeden önce bu metni kopyalayıp bir yere kaydet.</p></div>
      <div class="sec field"><h3>Yedekten geri yükle</h3><textarea id="imp" placeholder="Kaydettiğin yedek metnini buraya yapıştır"></textarea><button class="ghost" id="impBtn">Geri yükle</button><p class="note" id="impMsg"></p></div>`;
  }
  sheet.innerHTML=`<header><h2>Rapor</h2><button class="close" data-close>Kapat</button></header>
   <div class="tabs" role="tablist">${[["ozet","Özet"],["yedek","Yedek"]].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div>
   <div class="body" id="sheetBody">${body}</div>`;
}

function addHabit(name,h,rem){name=name.trim();if(!name)return false;
  const used=new Set(state.habits.map(x=>x.h));const hue=h??(HUES.find(x=>!used.has(x))??HUES[state.habits.length%HUES.length]);
  state.habits.push({id:uid(),name,h:hue,days:{},rem:rem||""});save();if(rem)askNotif();return true}
function askNotif(){try{if(window.App&&App.askNotif&&!App.notifOk())App.askNotif()}catch(e){}}

/* hızlı ekleme */
const qa=document.getElementById("qa"),qaBack=document.getElementById("qaBack");let qaRem="";
const qaOpen=()=>qa.classList.contains("open");
function renderChips(){
  const pre=["","08:00","12:00","20:00"],custom=qaRem&&!pre.includes(qaRem);
  document.getElementById("qaChips").innerHTML=pre.map(t=>`<button type="button" class="chip" data-qrem="${t}" aria-pressed="${qaRem===t}">${t||"Yok"}</button>`).join("")
   +`<label class="chip" aria-pressed="${custom}">${custom?qaRem:"Saat seç"}<input type="time" id="qaTime" value="${custom?qaRem:""}" aria-label="Özel saat"></label>`;
}
function openQA(){qaRem="";renderChips();document.getElementById("qaName").value="";qa.classList.add("open");qaBack.classList.add("open");qa.setAttribute("aria-hidden","false");
  setTimeout(()=>document.getElementById("qaName").focus(),60)}
function closeQA(){qa.classList.remove("open");qaBack.classList.remove("open");qa.setAttribute("aria-hidden","true");document.getElementById("qaName").blur()}
qaBack.onclick=closeQA;
document.addEventListener("change",e=>{
  if(e.target.id==="qaTime"&&e.target.value){qaRem=e.target.value;renderChips()}
  else if(e.target.dataset&&e.target.dataset.rem!=null){const h=state.habits[+e.target.dataset.rem];h.rem=e.target.value||"";save();if(h.rem){askNotif();showToast(`Her gün ${h.rem}'da hatırlatılacak`)}
    const sc=document.getElementById("sheetBody").scrollTop;renderSheet();document.getElementById("sheetBody").scrollTop=sc}
});

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if("qa" in d){openQA()}
  else if(d.qrem!=null){qaRem=d.qrem;renderChips()}
  else if("notif" in d){try{App.askNotif();setTimeout(()=>{if(!notifOk())App.openNotifSettings()},400)}catch(e){}}
  else if(d.remoff!=null){state.habits[+d.remoff].rem="";save();const sc=document.getElementById("sheetBody").scrollTop;renderSheet();document.getElementById("sheetBody").scrollTop=sc}
  else if("open" in d)openSheet("ozet");
  else if("close" in d)closeSheet();
  else if("done" in d)complete();
  else if("next" in d)goTo(idx+1);
  else if("back" in d)goTo(idx-1);
  else if(d.sug){addHabit(d.sug);renderMain()}
  else if(d.tab){tab=d.tab;pendingDel=null;renderSheet()}
  else if(d.k){const h=state.habits[+d.i];h.days[d.k]?delete h.days[d.k]:h.days[d.k]=true;save();const sc=document.getElementById("sheetBody").scrollTop;renderSheet();document.getElementById("sheetBody").scrollTop=sc}
  else if(d.del!=null){pendingDel=state.habits[+d.del].id;const sc=document.getElementById("sheetBody").scrollTop;renderSheet();document.getElementById("sheetBody").scrollTop=sc}
  else if(d.delYes!=null){const id=state.habits[+d.delYes].id;state.habits.splice(+d.delYes,1);skipped=skipped.filter(x=>x!==id);pendingDel=null;save();renderSheet()}
  else if("delNo" in d){pendingDel=null;renderSheet()}
  else if(d.hue){newHue=+d.hue;document.querySelectorAll("[data-hue]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.hue===newHue)))}
  else if(b.id==="copyBtn"){const txt=JSON.stringify(state);let ok=false;try{if(window.App&&App.copy){App.copy(txt);ok=true}}catch(e){}
    if(!ok){const ta=document.getElementById("exp");ta.select();try{ok=document.execCommand("copy")}catch(e){}}
    b.textContent=ok?"Kopyalandı":"Metni seçip kopyala"}
  else if(b.id==="impBtn"){const m=document.getElementById("impMsg");try{const s=JSON.parse(document.getElementById("imp").value);
    if(!s||!Array.isArray(s.habits))throw 0;state={habits:s.habits.filter(h=>h&&h.name&&h.days).map(h=>({id:h.id||uid(),name:String(h.name),h:+h.h||HUES[0],days:h.days}))};save();m.textContent=`${state.habits.length} alışkanlık geri yüklendi.`}
    catch(err){m.textContent="Bu metin bir yedek gibi görünmüyor. “Yedek al” bölümünden kopyaladığın metnin tamamını yapıştır."}}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="qa"){const name=document.getElementById("qaName").value;if(!name.trim()){document.getElementById("qaName").focus();return}
    addHabit(name,null,qaRem);closeQA();idx=state.habits.length-1;
    if(sheetOpen())renderSheet();renderMain();showToast(qaRem?`Eklendi · her gün ${qaRem}'da hatırlatılacak`:"Eklendi");return}
  if(e.target.id==="firstForm"){if(addHabit(document.getElementById("firstName").value))renderMain()}
  else if(e.target.id==="addForm"){const inp=document.getElementById("newName");if(addHabit(inp.value,newHue)){inp.value="";tab="ozet";renderSheet();showToast("Eklendi, ana ekranda sırada")}}
});

/* Android geri tuşu: önce paneli kapat */
window.onBack=()=>{if(qaOpen()){closeQA();return true}if(sheetOpen()){closeSheet();return true}return false};
/* uygulama öne gelince: bildirimden "Yaptım" denenleri işle */
window.onNativeResume=()=>{let ch=false;
  try{const s=window.App&&App.takeDone?App.takeDone():"";if(s)s.split(",").forEach(x=>{const [d,id]=x.split("|");const h=state.habits.find(y=>y.id===id);if(h&&d){h.days[d]=true;ch=true}})}catch(e){}
  if(key(today())!==dayStamp){dayStamp=key(today());idx=-1;ch=true}
  if(ch){save();if(idx>=0&&state.habits[idx]&&state.habits[idx].days[key(today())])idx=firstOpen();renderMain()}
  if(sheetOpen())renderSheet()};

/* sistem çubuklarının rengi temaya uysun */
function setBars(){try{if(window.App&&App.setBars){const cs=getComputedStyle(document.documentElement);const c=(sheetOpen()?cs.getPropertyValue("--panel"):cs.getPropertyValue("--bg")).trim();App.setBars(c,!matchMedia("(prefers-color-scheme: dark)").matches)}}catch(e){}}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",setBars);

/* gün değişince ekranı yenile */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&key(today())!==dayStamp){dayStamp=key(today());idx=-1;renderMain();if(sheetOpen())renderSheet()}});

syncNative();
renderMain();
</script>
</body>
</html>
