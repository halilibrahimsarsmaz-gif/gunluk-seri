                  a("Sözünde Durmak", "Yetim ergenlik çağına erişinceye kadar onun malına, en güzel şekil dışında yaklaşmayın. Verdiğiniz sözü yerine getirin; çünkü verilen sözden sorumlu tutulacaksınız.", "İsrâ Sûresi, 34"),
