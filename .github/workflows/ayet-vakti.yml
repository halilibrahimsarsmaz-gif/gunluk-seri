                  a("Tevazu", "Rahmân'ın kulları, yeryüzünde alçakgönüllülükle yürüyen kimselerdir. Cahiller onlara laf attığında \"Selâm!\" der geçerler.", "Furkân Sûresi, 63"),
                  a("Ölçülülük", "Onlar harcadıkları zaman ne israf ne de cimrilik ederler; ikisi arasında orta bir yol tutarlar.", "Furkân Sûresi, 67"),
                  a("Vakar", "Onlar yalan yere şahitlik etmezler; boş sözle karşılaştıklarında da onurlu bir şekilde geçip giderler.", "Furkân Sûresi, 72"),
                  a("Huzur", "Müminler gerçekten kurtuluşa ermiştir. Onlar namazlarında huşû içindedirler ve boş şeylerden yüz çevirirler.", "Mü'minûn Sûresi, 1-3"),
                  a("Güzel Davranış", "Kötülüğü en güzel olanla sav.", "Mü'minûn Sûresi, 96"),
                  a("Affetmek", "Affetsinler, hoş görsünler. Allah'ın sizi bağışlamasını istemez misiniz? Allah çok bağışlayan, çok merhamet edendir.", "Nûr Sûresi, 22"),
                  a("Affetmek", "Kim sabreder ve bağışlarsa, şüphesiz bu, kararlılık gerektiren işlerdendir.", "Şûrâ Sûresi, 43"),
                  a("Barış", "Kötülüğün karşılığı ona denk bir kötülüktür. Ama kim affeder ve barışı sağlarsa, onun ödülü Allah'a aittir.", "Şûrâ Sûresi, 40"),
