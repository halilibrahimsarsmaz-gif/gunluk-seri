# Ayet Vakti — her saat başı kilit ekranında bir ayet.
# Bu tek dosya uygulamanın tüm kaynak kodunu içerir; GitHub her kaydedişte APK'yı derleyip
# depo sayfasındaki "Releases" bölümüne koyar.
name: Ayet Vakti APK

on:
  push:
    branches: [ayet-vakti]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: 
    steps:
      - name: Kaynak dosyalarını oluştur
        run: |
          mkdir -p "$(dirname 'AndroidManifest.xml')"
          cat > 'AndroidManifest.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.halil.ayetvakti">

              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="Ayet Vakti"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".TickReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          AYET_EOF
          mkdir -p "$(dirname 'res/values/colors.xml')"
          cat > 'res/values/colors.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0F1A3A</color>
          </resources>
          AYET_EOF
          mkdir -p "$(dirname 'res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'res/mipmap-anydpi-v26/ic_launcher.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          AYET_EOF
          mkdir -p "$(dirname 'res/drawable/ic_fg.xml')"
          cat > 'res/drawable/ic_fg.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#D9B26A" android:pathData="M37,37 H71 V71 H37 Z" />
              <path android:fillColor="#D9B26A" android:pathData="M54,30 L78,54 L54,78 L30,54 Z" />
              <path android:fillColor="#0F1A3A" android:pathData="M44,54 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0 Z" />
              <path android:fillColor="#D9B26A" android:pathData="M49.5,54 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0 Z" />
          </vector>
          AYET_EOF
          mkdir -p "$(dirname 'src/com/halil/ayetvakti/AyetData.java')"
          cat > 'src/com/halil/ayetvakti/AyetData.java' <<'AYET_EOF'
