              }

              private static Ayet a(String topic, String text, String ref) { return new Ayet(topic, text, ref); }

              static final Ayet[] ALL = {
                  a("Kardeşlik", "Ey insanlar! Sizi bir erkek ve bir dişiden yarattık; birbirinizi tanıyasınız diye sizi milletlere ve kabilelere ayırdık. Allah katında en değerliniz, O'na karşı gelmekten en çok sakınanınızdır.", "Hucurât Sûresi, 13"),
                  a("Saygı", "Ey iman edenler! Bir topluluk bir başka topluluğu alaya almasın; belki onlar kendilerinden daha hayırlıdır. Birbirinizi ayıplamayın ve birbirinizi kötü lakaplarla çağırmayın.", "Hucurât Sûresi, 11"),
