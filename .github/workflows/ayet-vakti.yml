                  a("Hayat", "Asra andolsun ki insan gerçekten ziyandadır. Ancak iman edip salih ameller işleyenler, birbirlerine hakkı ve sabrı tavsiye edenler başka.", "Asr Sûresi, 1-3"),
                  a("Sorumluluk", "Kim zerre ağırlığınca bir hayır işlerse onu görür. Kim de zerre ağırlığınca bir kötülük işlerse onu görür.", "Zilzâl Sûresi, 7-8"),
                  a("Dil ve Kalp", "Arkadan çekiştirip yüze karşı alay eden herkesin vay haline!", "Hümeze Sûresi, 1"),
