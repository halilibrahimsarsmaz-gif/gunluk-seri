                  a("Anne Baba", "Rabbin, yalnız O'na kulluk etmenizi ve anne babaya iyi davranmanızı emretti. Onlardan biri ya da ikisi senin yanında yaşlanırsa onlara \"öf\" bile deme, onları azarlama; onlara güzel söz söyle.", "İsrâ Sûresi, 23"),
