                  a("Kardeşlik", "Müminler ancak kardeştir. Öyleyse kardeşlerinizin arasını düzeltin ve Allah'tan sakının ki size merhamet edilsin.", "Hucurât Sûresi, 10"),
                  a("Doğruluk", "Ey iman edenler! Size güvenilmez biri bir haber getirirse onu iyice araştırın; yoksa bilmeden bir topluluğa zarar verir, sonra yaptığınıza pişman olursunuz.", "Hucurât Sûresi, 6"),
                  a("Güzel Davranış", "İyilikle kötülük bir olmaz. Sen kötülüğü en güzel şekilde sav. O zaman seninle arasında düşmanlık bulunan kimse, sanki candan bir dost oluverir.", "Fussilet Sûresi, 34"),
                  a("Tevazu", "İnsanlardan yüz çevirip kibirlenme, yeryüzünde böbürlenerek yürüme. Çünkü Allah kendini beğenip övünen hiç kimseyi sevmez.", "Lokmân Sûresi, 18"),
