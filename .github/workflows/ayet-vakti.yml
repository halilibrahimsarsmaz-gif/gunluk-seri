                  a("Adalet", "Şüphesiz Allah adaleti, iyilik yapmayı ve yakınlara yardım etmeyi emreder; hayâsızlığı, kötülüğü ve azgınlığı yasaklar. Düşünüp öğüt alasınız diye size öğüt verir.", "Nahl Sûresi, 90"),
