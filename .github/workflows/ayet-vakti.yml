# Ayet Vakti — kilit ekranında ayet, Bursa namaz vakitleri ve hava durumu.
# Bu dosya uygulamanın tüm kaynak kodunu içerir; GitHub her kaydedişte imzasız APK'yı derler.
name: Ayet Vakti APK

on:
  push:
    branches: [ayet-vakti]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak dosyalarını oluştur
        run: |
          mkdir -p "$(dirname 'AndroidManifest.xml')"
          cat > 'AndroidManifest.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.halil.ayetvakti">

              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:label="Ayet Vakti"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ScreenService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Kilit ekrani ayetini yeniler ve okuma icin ekrani acik tutar" />
                  </service>

                  <receiver android:name=".TickReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          AYET_EOF
          mkdir -p "$(dirname 'res/drawable/ic_fg.xml')"
          cat > 'res/drawable/ic_fg.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#D9B26A" android:pathData="M37,37 H71 V71 H37 Z" />
              <path android:fillColor="#D9B26A" android:pathData="M54,30 L78,54 L54,78 L30,54 Z" />
              <path android:fillColor="#0F1A3A" android:pathData="M44,54 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0 Z" />
              <path android:fillColor="#D9B26A" android:pathData="M49.5,54 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0 Z" />
          </vector>
          AYET_EOF
          mkdir -p "$(dirname 'res/drawable/ic_stat.xml')"
          cat > 'res/drawable/ic_stat.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,6 H18 V18 H6 Z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,3.5 L20.5,12 L12,20.5 L3.5,12 Z" />
          </vector>
          AYET_EOF
          mkdir -p "$(dirname 'res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'res/mipmap-anydpi-v26/ic_launcher.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          AYET_EOF
          mkdir -p "$(dirname 'res/values/colors.xml')"
          cat > 'res/values/colors.xml' <<'AYET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0F1A3A</color>
          </resources>
          AYET_EOF
          mkdir -p "$(dirname 'src/com/halil/ayetvakti/AyetData.java')"
          cat > 'src/com/halil/ayetvakti/AyetData.java' <<'AYET_EOF'
          package com.halil.ayetvakti;

          /** Güzel ahlak, insan ilişkileri ve iyi insan olmak üzerine seçilmiş ayetler (meal: anlam aktarımı). */
          final class AyetData {
              private AyetData() {}

              static final class Ayet {
                  final String topic, text, ref;
                  Ayet(String topic, String text, String ref) { this.topic = topic; this.text = text; this.ref = ref; }
              }

              private static Ayet a(String topic, String text, String ref) { return new Ayet(topic, text, ref); }

              static final Ayet[] ALL = {
                  a("Kardeşlik", "Ey insanlar! Sizi bir erkek ve bir dişiden yarattık; birbirinizi tanıyasınız diye sizi milletlere ve kabilelere ayırdık. Allah katında en değerliniz, O'na karşı gelmekten en çok sakınanınızdır.", "Hucurât Sûresi, 13"),
                  a("Saygı", "Ey iman edenler! Bir topluluk bir başka topluluğu alaya almasın; belki onlar kendilerinden daha hayırlıdır. Birbirinizi ayıplamayın ve birbirinizi kötü lakaplarla çağırmayın.", "Hucurât Sûresi, 11"),
                  a("Dil ve Kalp", "Ey iman edenler! Zannın birçoğundan kaçının; çünkü zannın bir kısmı günahtır. Birbirinizin kusurlarını araştırmayın, birbirinizin arkasından çekiştirmeyin.", "Hucurât Sûresi, 12"),
                  a("Kardeşlik", "Müminler ancak kardeştir. Öyleyse kardeşlerinizin arasını düzeltin ve Allah'tan sakının ki size merhamet edilsin.", "Hucurât Sûresi, 10"),
                  a("Doğruluk", "Ey iman edenler! Size güvenilmez biri bir haber getirirse onu iyice araştırın; yoksa bilmeden bir topluluğa zarar verir, sonra yaptığınıza pişman olursunuz.", "Hucurât Sûresi, 6"),
                  a("Güzel Davranış", "İyilikle kötülük bir olmaz. Sen kötülüğü en güzel şekilde sav. O zaman seninle arasında düşmanlık bulunan kimse, sanki candan bir dost oluverir.", "Fussilet Sûresi, 34"),
                  a("Tevazu", "İnsanlardan yüz çevirip kibirlenme, yeryüzünde böbürlenerek yürüme. Çünkü Allah kendini beğenip övünen hiç kimseyi sevmez.", "Lokmân Sûresi, 18"),
                  a("Tevazu", "Yürüyüşünde ölçülü ol, sesini alçalt.", "Lokmân Sûresi, 19"),
                  a("Sabır", "Yavrum! Namazı kıl, iyiliği emret, kötülükten alıkoy, başına gelene sabret. Şüphesiz bunlar kararlılık gerektiren işlerdendir.", "Lokmân Sûresi, 17"),
                  a("Anne Baba", "Rabbin, yalnız O'na kulluk etmenizi ve anne babaya iyi davranmanızı emretti. Onlardan biri ya da ikisi senin yanında yaşlanırsa onlara \"öf\" bile deme, onları azarlama; onlara güzel söz söyle.", "İsrâ Sûresi, 23"),
                  a("Anne Baba", "Onlara merhamet ederek alçakgönüllülük kanadını indir ve de ki: \"Rabbim! Onlar beni küçükken nasıl şefkatle yetiştirdilerse, Sen de onlara öyle merhamet et.\"", "İsrâ Sûresi, 24"),
                  a("Cömertlik", "Akrabaya, yoksula ve yolda kalmışa hakkını ver; fakat malını saçıp savurma.", "İsrâ Sûresi, 26"),
                  a("Ölçülülük", "Elini boynuna bağlayıp cimri olma; büsbütün açıp saçma da. Sonra kınanmış ve pişman olarak oturup kalırsın.", "İsrâ Sûresi, 29"),
                  a("Sözünde Durmak", "Yetim ergenlik çağına erişinceye kadar onun malına, en güzel şekil dışında yaklaşmayın. Verdiğiniz sözü yerine getirin; çünkü verilen sözden sorumlu tutulacaksınız.", "İsrâ Sûresi, 34"),
                  a("Dürüstlük", "Ölçtüğünüz zaman tam ölçün, doğru terazi ile tartın. Bu hem daha hayırlı hem de sonuç bakımından daha güzeldir.", "İsrâ Sûresi, 35"),
                  a("Dil ve Kalp", "Hakkında bilgin olmayan şeyin ardına düşme. Çünkü kulak, göz ve kalp; bunların hepsi ondan sorumludur.", "İsrâ Sûresi, 36"),
                  a("Tevazu", "Yeryüzünde böbürlenerek yürüme. Çünkü sen ne yeri yarabilirsin ne de boyca dağlara ulaşabilirsin.", "İsrâ Sûresi, 37"),
                  a("Güzel Söz", "Kullarıma söyle, sözün en güzelini söylesinler.", "İsrâ Sûresi, 53"),
                  a("Adalet", "Şüphesiz Allah adaleti, iyilik yapmayı ve yakınlara yardım etmeyi emreder; hayâsızlığı, kötülüğü ve azgınlığı yasaklar. Düşünüp öğüt alasınız diye size öğüt verir.", "Nahl Sûresi, 90"),
                  a("Güzel Söz", "Rabbinin yoluna hikmetle ve güzel öğütle çağır; onlarla en güzel şekilde tartış.", "Nahl Sûresi, 125"),
                  a("Sabır", "Eğer karşılık verecekseniz, size yapılanın misliyle karşılık verin. Ama sabrederseniz, andolsun bu, sabredenler için daha hayırlıdır.", "Nahl Sûresi, 126"),
                  a("Salih Amel", "Erkek olsun kadın olsun, kim mümin olarak salih amel işlerse, ona mutlaka güzel bir hayat yaşatırız.", "Nahl Sûresi, 97"),
                  a("Affetmek", "Onlar bollukta da darlıkta da Allah yolunda harcayanlar, öfkelerini yutanlar ve insanları affedenlerdir. Allah iyilik yapanları sever.", "Âl-i İmrân Sûresi, 134"),
                  a("Merhamet", "Allah'ın rahmeti sayesinde onlara yumuşak davrandın. Eğer kaba ve katı yürekli olsaydın, etrafından dağılıp giderlerdi. Onları affet, onlar için bağışlanma dile ve işlerde onlarla danış.", "Âl-i İmrân Sûresi, 159"),
                  a("Cömertlik", "Sevdiğiniz şeylerden harcamadıkça iyiliğe asla erişemezsiniz.", "Âl-i İmrân Sûresi, 92"),
                  a("İyiliğe Çağrı", "İçinizden hayra çağıran, iyiliği emredip kötülükten alıkoyan bir topluluk bulunsun. İşte kurtuluşa erenler onlardır.", "Âl-i İmrân Sûresi, 104"),
                  a("Sabır", "Ey iman edenler! Sabredin, sabırda yarışın, birbirinize destek olun ve Allah'tan sakının ki kurtuluşa eresiniz.", "Âl-i İmrân Sûresi, 200"),
                  a("Güzel Söz", "Anne babaya, akrabaya, yetimlere ve yoksullara iyilik edin; insanlara güzel söz söyleyin.", "Bakara Sûresi, 83"),
                  a("Gerçek İyilik", "İyilik, yalnızca yüzünüzü doğuya ve batıya çevirmeniz değildir. Asıl iyilik; sevdiği maldan akrabaya, yetimlere, yoksullara ve yolda kalmışa verenlerin, sözlerini tutanların, darlıkta ve sıkıntıda sabredenlerin iyiliğidir.", "Bakara Sûresi, 177"),
                  a("Güzel Söz", "Güzel bir söz ve bağışlama, arkasından incitme gelen bir sadakadan daha hayırlıdır.", "Bakara Sûresi, 263"),
                  a("Cömertlik", "Ey iman edenler! Sadakalarınızı başa kakarak ve incitici davranarak boşa çıkarmayın.", "Bakara Sûresi, 264"),
                  a("Sabır", "Ey iman edenler! Sabır ve namazla yardım dileyin. Şüphesiz Allah sabredenlerle beraberdir.", "Bakara Sûresi, 153"),
                  a("İhsan", "İyilik edin; çünkü Allah iyilik edenleri sever.", "Bakara Sûresi, 195"),
                  a("Umut", "Allah hiç kimseye gücünün yetmediği bir şeyi yüklemez.", "Bakara Sûresi, 286"),
                  a("Doğruluk", "Hakkı bâtıl ile karıştırmayın; bile bile hakkı gizlemeyin.", "Bakara Sûresi, 42"),
                  a("Hayırda Yarış", "Hayırlarda birbirinizle yarışın.", "Bakara Sûresi, 148"),
                  a("Komşuluk", "Anne babaya, akrabaya, yetimlere, yoksullara, yakın komşuya, uzak komşuya, yanınızdaki arkadaşa, yolda kalmışa iyilik edin. Allah kendini beğenip böbürlenen kimseyi sevmez.", "Nisâ Sûresi, 36"),
                  a("Emanet", "Allah size, emanetleri ehline vermenizi ve insanlar arasında hükmettiğinizde adaletle hükmetmenizi emreder.", "Nisâ Sûresi, 58"),
                  a("Selam", "Bir selamla selamlandığınızda, ondan daha güzeliyle ya da aynısıyla karşılık verin.", "Nisâ Sûresi, 86"),
                  a("Adalet", "Ey iman edenler! Kendiniz, anne babanız ve yakınlarınız aleyhine de olsa, Allah için şahitlik eden adalet savunucuları olun.", "Nisâ Sûresi, 135"),
                  a("Barış", "Gizli konuşmalarının çoğunda hayır yoktur; ancak sadaka vermeyi, iyiliği ya da insanların arasını düzeltmeyi öğütleyenlerinki başka.", "Nisâ Sûresi, 114"),
                  a("Adalet", "Bir topluluğa olan kininiz sizi adaletsizliğe sürüklemesin. Adaletli olun; bu, takvaya daha yakındır.", "Mâide Sûresi, 8"),
                  a("Yardımlaşma", "İyilik ve takva üzerinde yardımlaşın; günah ve düşmanlık üzerinde yardımlaşmayın.", "Mâide Sûresi, 2"),
                  a("Hayatın Değeri", "Kim bir canı kurtarırsa, bütün insanları kurtarmış gibi olur.", "Mâide Sûresi, 32"),
                  a("Affetmek", "Sen affı esas al, iyiliği emret ve cahillerden yüz çevir.", "A'râf Sûresi, 199"),
                  a("Ölçülülük", "Yiyin, için; fakat israf etmeyin. Çünkü Allah israf edenleri sevmez.", "A'râf Sûresi, 31"),
                  a("İhsan", "Şüphesiz Allah'ın rahmeti iyilik yapanlara çok yakındır.", "A'râf Sûresi, 56"),
                  a("Tevazu", "Rahmân'ın kulları, yeryüzünde alçakgönüllülükle yürüyen kimselerdir. Cahiller onlara laf attığında \"Selâm!\" der geçerler.", "Furkân Sûresi, 63"),
                  a("Ölçülülük", "Onlar harcadıkları zaman ne israf ne de cimrilik ederler; ikisi arasında orta bir yol tutarlar.", "Furkân Sûresi, 67"),
                  a("Vakar", "Onlar yalan yere şahitlik etmezler; boş sözle karşılaştıklarında da onurlu bir şekilde geçip giderler.", "Furkân Sûresi, 72"),
                  a("Huzur", "Müminler gerçekten kurtuluşa ermiştir. Onlar namazlarında huşû içindedirler ve boş şeylerden yüz çevirirler.", "Mü'minûn Sûresi, 1-3"),
                  a("Güzel Davranış", "Kötülüğü en güzel olanla sav.", "Mü'minûn Sûresi, 96"),
                  a("Affetmek", "Affetsinler, hoş görsünler. Allah'ın sizi bağışlamasını istemez misiniz? Allah çok bağışlayan, çok merhamet edendir.", "Nûr Sûresi, 22"),
                  a("Affetmek", "Kim sabreder ve bağışlarsa, şüphesiz bu, kararlılık gerektiren işlerdendir.", "Şûrâ Sûresi, 43"),
                  a("Barış", "Kötülüğün karşılığı ona denk bir kötülüktür. Ama kim affeder ve barışı sağlarsa, onun ödülü Allah'a aittir.", "Şûrâ Sûresi, 40"),
                  a("İstişare", "Onların işleri aralarında danışma iledir; kendilerine verdiğimiz rızıktan da harcarlar.", "Şûrâ Sûresi, 38"),
                  a("İhlas", "Onlar, kendileri ihtiyaç duydukları halde yemeği yoksula, yetime ve esire yedirirler. \"Biz sizi yalnızca Allah rızası için doyuruyoruz; sizden ne bir karşılık ne de bir teşekkür bekliyoruz.\"", "İnsân Sûresi, 8-9"),
                  a("Merhamet", "Öyleyse sakın yetimi ezme. İsteyeni de azarlama.", "Duhâ Sûresi, 9-10"),
                  a("Merhamet", "Dini yalanlayanı gördün mü? İşte o, yetimi itip kakar ve yoksulu doyurmaya teşvik etmez.", "Mâûn Sûresi, 1-3"),
                  a("Hayat", "Asra andolsun ki insan gerçekten ziyandadır. Ancak iman edip salih ameller işleyenler, birbirlerine hakkı ve sabrı tavsiye edenler başka.", "Asr Sûresi, 1-3"),
                  a("Sorumluluk", "Kim zerre ağırlığınca bir hayır işlerse onu görür. Kim de zerre ağırlığınca bir kötülük işlerse onu görür.", "Zilzâl Sûresi, 7-8"),
                  a("Dil ve Kalp", "Arkadan çekiştirip yüze karşı alay eden herkesin vay haline!", "Hümeze Sûresi, 1"),
                  a("Dürüstlük", "Ölçüde ve tartıda hile yapanların vay haline! Onlar insanlardan alırken tam alırlar; onlara ölçüp tarttıklarında ise eksik verirler.", "Mutaffifîn Sûresi, 1-3"),
                  a("Söz ve Amel", "Ey iman edenler! Yapmayacağınız şeyleri niçin söylüyorsunuz? Yapmayacağınız şeyleri söylemeniz Allah katında büyük bir öfke sebebidir.", "Saf Sûresi, 2-3"),
                  a("Doğruluk", "Ey iman edenler! Allah'tan sakının ve doğru söz söyleyin.", "Ahzâb Sûresi, 70"),
                  a("Doğruluk", "Ey iman edenler! Allah'tan sakının ve doğrularla beraber olun.", "Tevbe Sûresi, 119"),
                  a("İhsan", "Allah sana nasıl iyilik ettiyse sen de öyle iyilik et; yeryüzünde bozgunculuk peşinde olma.", "Kasas Sûresi, 77"),
                  a("Güzel Ahlak", "Ve şüphesiz sen yüce bir ahlak üzerindesin.", "Kalem Sûresi, 4"),
                  a("Güzel Davranış", "Onlar Rablerinin rızasını isteyerek sabrederler, Allah yolunda harcarlar ve kötülüğü iyilikle savarlar.", "Ra'd Sûresi, 22"),
                  a("Değişim", "Bir topluluk kendinde olanı değiştirmedikçe Allah onların durumunu değiştirmez.", "Ra'd Sûresi, 11"),
                  a("İhsan", "İyiliğin karşılığı ancak iyilik değil midir?", "Rahmân Sûresi, 60"),
                  a("Umut", "Şüphesiz güçlükle beraber bir kolaylık vardır. Gerçekten, güçlükle beraber bir kolaylık vardır.", "İnşirâh Sûresi, 5-6"),
                  a("Sabır", "Sabret; çünkü Allah iyilik yapanların ecrini asla zayi etmez.", "Hûd Sûresi, 115"),
                  a("Emek", "İnsan için ancak çalıştığının karşılığı vardır.", "Necm Sûresi, 39"),
                  a("Güzel Söz", "Ona yumuşak söz söyleyin; belki öğüt alır ya da içi titrer.", "Tâhâ Sûresi, 44"),

                  // --- Bakara ---
                  a("Sabır", "Sabır ve namazla yardım dileyin. Şüphesiz bu, gönülden saygıyla boyun eğenlerden başkasına ağır gelir.", "Bakara Sûresi, 45"),
                  a("Söz ve Amel", "İnsanlara iyiliği emredip kendinizi unutuyor musunuz? Hiç aklınızı kullanmaz mısınız?", "Bakara Sûresi, 44"),
                  a("Sabır", "Andolsun sizi biraz korku, açlık, mallardan, canlardan ve ürünlerden eksiltme ile deneriz. Sabredenleri müjdele. Onlar başlarına bir musibet geldiğinde \"Biz Allah'a aidiz ve O'na döneceğiz\" derler.", "Bakara Sûresi, 155-156"),
                  a("Şükür", "Siz beni anın ki ben de sizi anayım. Bana şükredin, nankörlük etmeyin.", "Bakara Sûresi, 152"),
                  a("Dua", "Kullarım beni sana sorduklarında bilsinler ki ben çok yakınım. Bana dua ettiğinde, dua edenin dileğine karşılık veririm.", "Bakara Sûresi, 186"),
                  a("Dürüstlük", "Mallarınızı aranızda haksız yollarla yemeyin.", "Bakara Sûresi, 188"),
                  a("Tevekkül", "Hoşunuza gitmeyen bir şey sizin için hayırlı olabilir; hoşunuza giden bir şey de sizin için kötü olabilir. Allah bilir, siz bilmezsiniz.", "Bakara Sûresi, 216"),
                  a("Fazilet", "Bağışlamanız takvaya daha yakındır. Aranızdaki iyiliği ve fazileti unutmayın.", "Bakara Sûresi, 237"),
                  a("Hoşgörü", "Dinde zorlama yoktur.", "Bakara Sûresi, 256"),
                  a("Cömertlik", "Mallarını Allah yolunda harcayanların durumu, yedi başak bitiren ve her başakta yüz tane bulunan bir tohum gibidir. Allah dilediğine kat kat verir.", "Bakara Sûresi, 261"),
                  a("İhlas", "Sadakaları açıktan verirseniz ne güzel! Eğer onları gizleyerek yoksullara verirseniz bu sizin için daha hayırlıdır.", "Bakara Sûresi, 271"),
                  a("İffet", "Onlar onurlarından dolayı bilmeyene zengin görünürler; sen onları yüzlerinden tanırsın. İnsanlardan yüzsüzce bir şey istemezler.", "Bakara Sûresi, 273"),
                  a("Cömertlik", "Mallarını gece ve gündüz, gizli ve açık harcayanların ödülleri Rableri katındadır. Onlara korku yoktur, üzülmeyecekler de.", "Bakara Sûresi, 274"),
                  a("Kolaylık", "Eğer borçlu darlık içindeyse, ona eli genişleyinceye kadar süre verin. Borcu bağışlamanız ise, bilirseniz sizin için daha hayırlıdır.", "Bakara Sûresi, 280"),
                  a("Doğruluk", "Şahitliği gizlemeyin. Kim onu gizlerse, kalbi günahkârdır.", "Bakara Sûresi, 283"),
                  a("Barış", "Yeminlerinizi iyilik yapmanıza, takvalı olmanıza ve insanların arasını düzeltmenize engel kılmayın.", "Bakara Sûresi, 224"),
                  a("Barış", "Ey iman edenler! Hep birlikte barış ve teslimiyete girin; şeytanın adımlarına uymayın.", "Bakara Sûresi, 208"),
                  a("Takva", "Azık edinin; şüphesiz azığın en hayırlısı takvadır.", "Bakara Sûresi, 197"),
                  a("Dua", "Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi ateş azabından koru.", "Bakara Sûresi, 201"),
                  a("Hayır", "Kendiniz için önceden ne hayır gönderirseniz, Allah katında onu bulursunuz.", "Bakara Sûresi, 110"),
                  a("Cömertlik", "Sana neyi harcayacaklarını sorarlar. De ki: \"İhtiyaçtan artanı.\"", "Bakara Sûresi, 219"),
                  a("Cömertlik", "Hayır olarak ne harcarsanız, anne baba, yakınlar, yetimler, yoksullar ve yolda kalmışlar içindir. Hayırdan ne yaparsanız, şüphesiz Allah onu bilir.", "Bakara Sûresi, 215"),
                  a("Dua", "Rabbimiz! Üzerimize sabır yağdır, ayaklarımızı sağlam bastır.", "Bakara Sûresi, 250"),
                  a("Tövbe", "Şüphesiz Allah çok tövbe edenleri ve temizlenenleri sever.", "Bakara Sûresi, 222"),

                  // --- Âl-i İmrân ---
                  a("Dua", "Rabbimiz! Bizi doğru yola ilettikten sonra kalplerimizi kaydırma; bize katından rahmet bağışla.", "Âl-i İmrân Sûresi, 8"),
                  a("Güzel Ahlak", "Onlar sabredenler, doğru sözlüler, gönülden itaat edenler, Allah yolunda harcayanlar ve seher vakitlerinde bağışlanma dileyenlerdir.", "Âl-i İmrân Sûresi, 17"),
                  a("Birlik", "Hep birlikte Allah'ın ipine sımsıkı sarılın, parçalanıp ayrılmayın. Allah'ın size olan nimetini hatırlayın: Hani siz düşmanlardınız da O kalplerinizi birleştirmişti.", "Âl-i İmrân Sûresi, 103"),
                  a("İyiliğe Çağrı", "Siz insanlar için çıkarılmış en hayırlı ümmetsiniz; iyiliği emreder, kötülükten alıkoyar ve Allah'a inanırsınız.", "Âl-i İmrân Sûresi, 110"),
                  a("Hayırda Yarış", "Rabbinizin bağışlamasına ve genişliği göklerle yer kadar olan cennete koşun.", "Âl-i İmrân Sûresi, 133"),
                  a("Tövbe", "Onlar çirkin bir iş yaptıklarında ya da kendilerine kötülük ettiklerinde Allah'ı anıp günahlarının bağışlanmasını dilerler ve yaptıklarında bile bile ısrar etmezler.", "Âl-i İmrân Sûresi, 135"),
                  a("Umut", "Gevşemeyin, üzülmeyin; eğer inanıyorsanız üstün olan sizsiniz.", "Âl-i İmrân Sûresi, 139"),
                  a("Sabır", "Sabreder ve Allah'tan sakınırsanız, şüphesiz bu, kararlılık gerektiren işlerdendir.", "Âl-i İmrân Sûresi, 186"),
                  a("Tefekkür", "Göklerin ve yerin yaratılışında, gece ile gündüzün birbiri ardınca gelişinde akıl sahipleri için deliller vardır. Onlar ayakta, otururken ve yatarken Allah'ı anarlar.", "Âl-i İmrân Sûresi, 190-191"),
                  a("Sözünde Durmak", "Kim sözünü yerine getirir ve Allah'tan sakınırsa bilsin ki Allah sakınanları sever.", "Âl-i İmrân Sûresi, 76"),
                  a("Tevekkül", "Allah bize yeter; O ne güzel vekildir.", "Âl-i İmrân Sûresi, 173"),
                  a("Sabır", "Allah yolunda başlarına gelenlerden dolayı gevşemediler, zayıflık göstermediler, boyun eğmediler. Allah sabredenleri sever.", "Âl-i İmrân Sûresi, 146"),

                  // --- Nisâ ---
                  a("Akrabalık", "Ey insanlar! Sizi tek bir candan yaratan Rabbinizden sakının. Adını anarak birbirinizden dilekte bulunduğunuz Allah'tan ve akrabalık bağlarını koparmaktan sakının.", "Nisâ Sûresi, 1"),
                  a("Güzel Söz", "Miras taksiminde akrabalar, yetimler ve yoksullar hazır bulunursa, ondan onlara da verin ve onlara güzel söz söyleyin.", "Nisâ Sûresi, 8"),
                  a("Aile", "Eşlerinizle iyilikle geçinin. Eğer onlardan hoşlanmazsanız, olabilir ki hoşlanmadığınız bir şeyde Allah birçok hayır takdir etmiştir.", "Nisâ Sûresi, 19"),
                  a("Merhamet", "Allah sizin yükünüzü hafifletmek ister; çünkü insan zayıf yaratılmıştır.", "Nisâ Sûresi, 28"),
                  a("Kıskançlık", "Allah'ın kiminizi kiminize üstün kıldığı şeylere göz dikmeyin. Allah'tan O'nun lütfunu isteyin.", "Nisâ Sûresi, 32"),
                  a("Aracılık", "Kim güzel bir işe aracılık ederse, ondan onun da bir payı olur. Kim kötü bir işe aracılık ederse, ondan onun da bir payı olur.", "Nisâ Sûresi, 85"),
                  a("Barış", "Barış daha hayırlıdır. İyilik eder ve sakınırsanız, şüphesiz Allah yaptıklarınızdan haberdardır.", "Nisâ Sûresi, 128"),
                  a("Dil ve Kalp", "Allah, kötü sözün açıkça söylenmesini sevmez; ancak zulme uğrayan başka.", "Nisâ Sûresi, 148"),
                  a("Affetmek", "Bir iyiliği açığa vurur ya da gizlerseniz veya bir kötülüğü affederseniz, bilin ki Allah çok affedicidir, her şeye gücü yetendir.", "Nisâ Sûresi, 149"),
                  a("Dürüstlük", "Ey iman edenler! Mallarınızı aranızda haksız yollarla yemeyin; ancak karşılıklı rızaya dayanan ticaret başka.", "Nisâ Sûresi, 29"),
                  a("Emanet", "Yetimlere mallarını verin; temizi pis olanla değiştirmeyin.", "Nisâ Sûresi, 2"),
                  a("Saygı", "Size selam verene, dünya hayatının geçici menfaatini arayarak \"Sen mümin değilsin\" demeyin.", "Nisâ Sûresi, 94"),
                  a("İhsan", "Şüphesiz Allah zerre kadar zulmetmez. Bir iyilik olursa onu kat kat artırır ve kendi katından büyük bir ödül verir.", "Nisâ Sûresi, 40"),
                  a("Tövbe", "Kim bir kötülük yapar ya da kendine zulmeder, sonra Allah'tan bağışlanma dilerse, Allah'ı çok bağışlayan, çok merhametli bulur.", "Nisâ Sûresi, 110"),
                  a("Dürüstlük", "Kim bir hata ya da günah işler de sonra onu suçsuz birinin üzerine atarsa, büyük bir iftira ve açık bir günah yüklenmiş olur.", "Nisâ Sûresi, 112"),

                  // --- Mâide, En'âm, A'râf, Enfâl, Tevbe ---
                  a("Sözünde Durmak", "Ey iman edenler! Sözleşmelerinizi yerine getirin.", "Mâide Sûresi, 1"),
                  a("Adalet", "Eğer hükmedersen aralarında adaletle hükmet. Şüphesiz Allah adaletli olanları sever.", "Mâide Sûresi, 42"),
                  a("Hayırda Yarış", "Hayırlarda yarışın. Hepinizin dönüşü Allah'adır.", "Mâide Sûresi, 48"),
                  a("Kötü Alışkanlık", "Ey iman edenler! İçki, kumar, dikili taşlar ve fal okları şeytan işi birer pisliktir. Bunlardan uzak durun ki kurtuluşa eresiniz.", "Mâide Sûresi, 90"),
                  a("Doğruluk", "De ki: Kötünün çokluğu hoşuna gitse bile, kötü ile iyi bir olmaz.", "Mâide Sûresi, 100"),
                  a("Alçakgönüllülük", "Allah'ın sevdiği ve O'nu seven bir topluluk; müminlere karşı alçakgönüllü, kınayanın kınamasından korkmayan kimseler.", "Mâide Sûresi, 54"),
                  a("Saygı", "Allah'tan başkasına tapanlara sövmeyin; sonra onlar da bilmeyerek Allah'a söverler.", "En'âm Sûresi, 108"),
                  a("Adalet", "Konuştuğunuz zaman, yakınınız da olsa adaletli olun ve Allah'a verdiğiniz sözü yerine getirin.", "En'âm Sûresi, 152"),
                  a("İhsan", "Kim bir iyilikle gelirse ona bunun on katı vardır.", "En'âm Sûresi, 160"),
                  a("Sorumluluk", "Hiçbir günahkâr başkasının günah yükünü taşımaz.", "En'âm Sûresi, 164"),
                  a("Dua", "Rabbinize yalvararak ve gizlice dua edin. Şüphesiz O, haddi aşanları sevmez.", "A'râf Sûresi, 55"),
                  a("Dürüstlük", "İnsanların eşyalarını eksik vermeyin; düzeltildikten sonra yeryüzünde bozgunculuk yapmayın.", "A'râf Sûresi, 85"),
                  a("Huşu", "Kur'an okunduğu zaman onu dinleyin ve susun ki size merhamet edilsin.", "A'râf Sûresi, 204"),
                  a("Zikir", "Rabbini içinden, yalvararak ve korkarak, yüksek olmayan bir sesle sabah akşam an; gafillerden olma.", "A'râf Sûresi, 205"),
                  a("Tövbe", "Rabbimiz! Biz kendimize zulmettik. Eğer bizi bağışlamaz ve bize merhamet etmezsen elbette kaybedenlerden oluruz.", "A'râf Sûresi, 23"),
                  a("Birlik", "Birbirinizle çekişmeyin; sonra gevşersiniz ve gücünüz gider. Sabredin; şüphesiz Allah sabredenlerle beraberdir.", "Enfâl Sûresi, 46"),
                  a("Barış", "Eğer onlar barışa yanaşırlarsa sen de ona yanaş ve Allah'a tevekkül et.", "Enfâl Sûresi, 61"),
                  a("Emanet", "Ey iman edenler! Allah'a ve Resule ihanet etmeyin; bile bile emanetlerinize de ihanet etmeyin.", "Enfâl Sûresi, 27"),
                  a("Dostluk", "Mümin erkekler ve mümin kadınlar birbirlerinin dostlarıdır. İyiliği emreder, kötülükten alıkoyarlar.", "Tevbe Sûresi, 71"),
                  a("Merhamet", "Andolsun size içinizden öyle bir peygamber gelmiştir ki, sıkıntıya uğramanız ona çok ağır gelir; size çok düşkündür, müminlere karşı şefkatli ve merhametlidir.", "Tevbe Sûresi, 128"),
                  a("Tevekkül", "Üzülme, şüphesiz Allah bizimle beraberdir.", "Tevbe Sûresi, 40"),
                  a("Emek", "De ki: Çalışın! Yaptıklarınızı Allah da, Resulü de, müminler de görecek.", "Tevbe Sûresi, 105"),

                  // --- Yûnus, Hûd, Yûsuf, Ra'd, İbrâhîm, Hicr ---
                  a("Adalet", "Şüphesiz Allah insanlara hiçbir şekilde zulmetmez; fakat insanlar kendilerine zulmederler.", "Yûnus Sûresi, 44"),
                  a("Şifa", "Ey insanlar! Size Rabbinizden bir öğüt, gönüllerdeki dertlere bir şifa, müminler için bir hidayet ve rahmet gelmiştir.", "Yûnus Sûresi, 57"),
                  a("Huzur", "Bilesiniz ki Allah'ın dostlarına korku yoktur, onlar üzülmeyeceklerdir de.", "Yûnus Sûresi, 62"),
                  a("İyilik", "Şüphesiz iyilikler kötülükleri giderir. Bu, öğüt alanlar için bir öğüttür.", "Hûd Sûresi, 114"),
                  a("Dürüstlük", "Ölçüyü ve tartıyı adaletle tam yapın; insanların eşyalarını eksik vermeyin.", "Hûd Sûresi, 85"),
                  a("Islah", "Gücüm yettiğince düzeltmekten başka bir şey istemiyorum. Başarım ancak Allah'ın yardımıyladır.", "Hûd Sûresi, 88"),
                  a("Tövbe", "Rabbinizden bağışlanma dileyin, sonra O'na tövbe edin. Şüphesiz Rabbim çok merhametlidir, çok sevendir.", "Hûd Sûresi, 90"),
                  a("Sabır", "Bana düşen güzel bir sabırdır.", "Yûsuf Sûresi, 18"),
                  a("Umut", "Allah'ın rahmetinden ümidinizi kesmeyin.", "Yûsuf Sûresi, 87"),
                  a("Affetmek", "Bugün size bir kınama yok. Allah sizi bağışlasın; O, merhamet edenlerin en merhametlisidir.", "Yûsuf Sûresi, 92"),
                  a("Nefis", "Ben nefsimi temize çıkarmam. Çünkü nefis, Rabbimin merhamet ettiği hariç, kötülüğü emreder.", "Yûsuf Sûresi, 53"),
                  a("Sabır", "Kim Allah'tan sakınır ve sabrederse, şüphesiz Allah iyilik yapanların ecrini zayi etmez.", "Yûsuf Sûresi, 90"),
                  a("Huzur", "Bilesiniz ki kalpler ancak Allah'ı anmakla huzur bulur.", "Ra'd Sûresi, 28"),
                  a("Sözünde Durmak", "Onlar Allah'a verdikleri sözü yerine getirirler, antlaşmayı bozmazlar ve Allah'ın gözetilmesini emrettiği bağları gözetirler.", "Ra'd Sûresi, 20-21"),
                  a("Şükür", "Eğer şükrederseniz, elbette size nimetimi artırırım.", "İbrâhîm Sûresi, 7"),
                  a("Güzel Söz", "Güzel bir söz, kökü sağlam, dalları göğe uzanan güzel bir ağaç gibidir. O ağaç Rabbinin izniyle her zaman meyvesini verir.", "İbrâhîm Sûresi, 24-25"),
                  a("Anne Baba", "Rabbimiz! Hesabın görüleceği gün beni, anne babamı ve müminleri bağışla.", "İbrâhîm Sûresi, 41"),
                  a("Cömertlik", "İman eden kullarıma söyle, namazı kılsınlar ve kendilerine verdiğimiz rızıktan gizli ve açık harcasınlar.", "İbrâhîm Sûresi, 31"),
                  a("Hoşgörü", "Sen onlara güzel bir şekilde hoşgörü göster.", "Hicr Sûresi, 85"),
                  a("Şefkat", "Müminlere şefkat kanatlarını ger.", "Hicr Sûresi, 88"),

                  // --- Nahl, İsrâ, Kehf, Meryem, Tâhâ, Enbiyâ, Hac ---
                  a("Sözünde Durmak", "Antlaştığınız zaman Allah'ın ahdini yerine getirin; yeminlerinizi sağlamlaştırdıktan sonra bozmayın.", "Nahl Sûresi, 91"),
                  a("İhsan", "Şüphesiz Allah, sakınanlarla ve iyilik yapanlarla beraberdir.", "Nahl Sûresi, 128"),
                  a("Şükür", "Allah'ın nimetini saymaya kalksanız sayamazsınız.", "Nahl Sûresi, 18"),
                  a("Sabır", "Sabret; senin sabrın ancak Allah'ın yardımıyladır. Onlar için üzülme, kurdukları tuzaklardan dolayı da sıkıntıya düşme.", "Nahl Sûresi, 127"),
                  a("Şükür", "Allah'ın size verdiği rızıktan helal ve temiz olarak yiyin; Allah'ın nimetine şükredin.", "Nahl Sûresi, 114"),
                  a("İyilik", "İyilik ederseniz kendinize iyilik etmiş olursunuz; kötülük ederseniz o da kendinizedir.", "İsrâ Sûresi, 7"),
                  a("Güzel Söz", "Eğer onlardan yüz çevirmek zorunda kalırsan, onlara yumuşak bir söz söyle.", "İsrâ Sûresi, 28"),
                  a("Dua", "Rabbim! Gireceğim yere doğrulukla girdir, çıkacağım yerden doğrulukla çıkar.", "İsrâ Sûresi, 80"),
                  a("Sabır", "İnsan hayra dua eder gibi şerre de dua eder. İnsan pek acelecidir.", "İsrâ Sûresi, 11"),
                  a("Tövbe", "Rabbiniz içinizde olanı en iyi bilendir. Eğer iyi kimseler olursanız, şüphesiz O, tövbe ederek kendisine yönelenleri çok bağışlayandır.", "İsrâ Sûresi, 25"),
                  a("Dostluk", "Sabah akşam Rablerinin rızasını isteyerek O'na dua edenlerle birlikte sabret; gözlerini onlardan ayırma.", "Kehf Sûresi, 28"),
                  a("Kalıcı Olan", "Mal ve oğullar dünya hayatının süsüdür. Kalıcı olan salih ameller ise Rabbinin katında sevapça daha hayırlı, umut bağlamaya da daha lâyıktır.", "Kehf Sûresi, 46"),
                  a("Tevazu", "Hiçbir şey için \"Bunu yarın yapacağım\" deme; ancak \"Allah dilerse\" de.", "Kehf Sûresi, 23-24"),
                  a("Dua", "Rabbimiz! Bize katından rahmet ver ve işimizde bize doğruyu kolaylaştır.", "Kehf Sûresi, 10"),
                  a("Sevgi", "İman edip salih ameller işleyenler için Rahmân, gönüllerde bir sevgi yaratacaktır.", "Meryem Sûresi, 96"),
                  a("Anne Baba", "Beni anneme iyi davranan biri kıldı; beni zorba ve isyankâr kılmadı.", "Meryem Sûresi, 32"),
                  a("Güzel Söz", "Selâm sana! Rabbimden senin için bağışlanma dileyeceğim.", "Meryem Sûresi, 47"),
                  a("Dua", "Rabbim! Göğsümü genişlet, işimi bana kolaylaştır, dilimdeki düğümü çöz ki sözümü anlasınlar.", "Tâhâ Sûresi, 25-28"),
                  a("İlim", "Rabbim, ilmimi artır.", "Tâhâ Sûresi, 114"),
                  a("Kanaat", "Onlardan bazı gruplara dünya hayatının süsü olarak verdiğimiz şeylere gözlerini dikme.", "Tâhâ Sûresi, 131"),
                  a("Tevekkül", "Korkmayın; ben sizinle beraberim, işitirim ve görürüm.", "Tâhâ Sûresi, 46"),
                  a("Merhamet", "Seni ancak âlemlere rahmet olarak gönderdik.", "Enbiyâ Sûresi, 107"),
                  a("Hayırda Yarış", "Onlar hayırlarda yarışırlar, umarak ve korkarak bize dua ederlerdi; bize karşı derin saygı içindeydiler.", "Enbiyâ Sûresi, 90"),
                  a("Salih Amel", "Ey iman edenler! Rükû edin, secde edin, Rabbinize kulluk edin ve hayır işleyin ki kurtuluşa eresiniz.", "Hac Sûresi, 77"),
                  a("İhlas", "Onların ne etleri ne de kanları Allah'a ulaşır; fakat O'na sizin takvanız ulaşır.", "Hac Sûresi, 37"),
                  a("Kalp", "Asıl kör olan gözler değil, göğüslerdeki kalplerdir.", "Hac Sûresi, 46"),
                  a("Doğruluk", "Yalan sözden kaçının.", "Hac Sûresi, 30"),

                  // --- Mü'minûn, Nûr, Furkân, Şuarâ, Neml, Kasas, Ankebût, Rûm ---
                  a("Emanet", "Onlar emanetlerine ve sözlerine riayet ederler.", "Mü'minûn Sûresi, 8"),
                  a("Hayırda Yarış", "Onlar Rablerine dönecekleri için kalpleri ürpererek verdiklerini verirler. İşte onlar hayırlarda koşuşurlar.", "Mü'minûn Sûresi, 60-61"),
                  a("Dua", "Rabbim! Bağışla, merhamet et; sen merhamet edenlerin en hayırlısısın.", "Mü'minûn Sûresi, 118"),
                  a("Hüsnüzan", "Bu sözü işittiğinizde mümin erkekler ve kadınların, kendi vicdanlarıyla iyi zanda bulunup \"Bu apaçık bir iftiradır\" demeleri gerekmez miydi?", "Nûr Sûresi, 12"),
                  a("Dil ve Kalp", "Bilmediğiniz bir şeyi ağızlarınızla söylüyor ve onu önemsiz sanıyordunuz; oysa o Allah katında büyüktür. Onu işittiğinizde \"Bunu konuşmak bize yakışmaz\" demeniz gerekmez miydi?", "Nûr Sûresi, 15-16"),
                  a("Mahremiyet", "Ey iman edenler! Kendi evlerinizden başka evlere, izin alıp ev halkına selam vermeden girmeyin.", "Nûr Sûresi, 27"),
                  a("İffet", "Mümin erkeklere söyle, gözlerini haramdan sakınsınlar ve iffetlerini korusunlar. Bu onlar için daha temizdir.", "Nûr Sûresi, 30"),
                  a("Selam", "Evlere girdiğinizde birbirinize Allah katından bereketli ve güzel bir esenlik dileği olarak selam verin.", "Nûr Sûresi, 61"),
                  a("Aile", "Rabbimiz! Bize eşlerimizden ve çocuklarımızdan göz aydınlığı olacak nesiller bağışla ve bizi takva sahiplerine önder kıl.", "Furkân Sûresi, 74"),
                  a("Dua", "Rabbim! Bana hikmet ver ve beni iyiler arasına kat. Sonra gelecekler arasında beni doğrulukla anılanlardan eyle.", "Şuarâ Sûresi, 83-84"),
                  a("Dürüstlük", "Ölçüyü tam yapın, eksik verenlerden olmayın. Doğru terazi ile tartın. İnsanların eşyalarını eksik vermeyin.", "Şuarâ Sûresi, 181-183"),
                  a("Tevazu", "Sana uyan müminlere alçakgönüllülükle kanat ger.", "Şuarâ Sûresi, 215"),
                  a("Şükür", "Rabbim! Bana ve anne babama verdiğin nimete şükretmemi ve razı olacağın salih ameller işlememi bana ilham et.", "Neml Sûresi, 19"),
                  a("Şükür", "Kim şükrederse ancak kendisi için şükreder.", "Neml Sûresi, 40"),
                  a("Vakar", "Boş sözü işittiklerinde ondan yüz çevirirler ve \"Bizim işlerimiz bize, sizin işleriniz size. Size selam olsun, biz cahilleri istemeyiz\" derler.", "Kasas Sûresi, 55"),
