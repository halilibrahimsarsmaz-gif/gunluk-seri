name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: İmza anahtarını hazırla
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks
      - name: Derle
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Sürüm yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk GunlukSeri.apk
          gh release create "v1.${{ github.run_number }}" GunlukSeri.apk --title "Günlük Seri 1.${{ github.run_number }}" --notes "Telefona kurulabilir APK." --latest
