name: Kilo Hedefim APK

on:
  push:
    branches: [main]
    paths:
      - 'kilo-hedefim/**'
      - '.github/workflows/kilo-hedefim-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: İmza anahtarını hazırla
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KS_PASS=$KS_PASS_SECRET" >> $GITHUB_ENV
          else
            P=$(openssl rand -hex 16)
            echo "::add-mask::$P"
            keytool -genkeypair -keystore $RUNNER_TEMP/release.jks -storetype PKCS12 -alias gunlukseri -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Kilo Hedefim"
            echo "KS_PASS=$P" >> $GITHUB_ENV
          fi
      - name: Derle
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p kilo-hedefim --no-daemon assembleRelease
      - name: Sürüm yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp kilo-hedefim/app/build/outputs/apk/release/app-release.apk KiloHedefim.apk
          gh release create "kilo-v1.${{ github.run_number }}" KiloHedefim.apk --title "Kilo Hedefim 1.${{ github.run_number }}" --notes "Telefona kurulabilir APK." --latest=false
